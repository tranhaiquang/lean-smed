<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMED Changeover</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sidebar điều hướng (desktop) + vùng làm việc; điện thoại: thanh trên + ngăn kéo menu. Phong cách "andon" xưởng may: mực xanh than, vàng an toàn cho hành động chính. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e6eaef; --surface-3:#d9dfe6;
  --ink:#14202c; --ink-2:#4b5968; --ink-3:#7a8796; --line:#d2d9e0;
  --nav:#17293d; --nav-ink:#c9d6e3; --nav-active:#24405e;
  --accent:#efa91a; --accent-ink:#1b1405; --accent-soft:#fbecc8;
  --ok:#1d8656; --ok-soft:#d9f0e4; --warn:#b86f00; --warn-soft:#fbe9c9;
  --bad:#c0362c; --bad-soft:#f8dcd9; --info:#2c67a8; --info-soft:#dce8f6;
  --c-ext:#2c67a8; --c-int:#c0362c; --c-wait:#b86f00; --c-qa:#7b4bb3; --c-ramp:#1d8656;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 4px 14px rgba(20,32,44,.06);
  --f-display:"Barlow Condensed","Noto Sans KR","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#16202a; --surface-2:#1c2833; --surface-3:#26343f;
  --ink:#e5ecf2; --ink-2:#a2b2c1; --ink-3:#74879a; --line:#2b3a47;
  --nav:#0a121a; --nav-ink:#a9bacb; --nav-active:#1b2c3d;
  --accent:#f2b432; --accent-ink:#1b1405; --accent-soft:#3a2e12;
  --ok:#3fbf83; --ok-soft:#14352a; --warn:#e9a23b; --warn-soft:#3a2a10; --bad:#f06a5f; --bad-soft:#3d1a18; --info:#69a4e6; --info-soft:#152a42;
  --c-ext:#69a4e6; --c-int:#f06a5f; --c-wait:#e9a23b; --c-qa:#b18ae6; --c-ramp:#3fbf83;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1c2833; --surface-3:#26343f;
  --ink:#e5ecf2; --ink-2:#a2b2c1; --ink-3:#74879a; --line:#2b3a47;
  --nav:#0a121a; --nav-ink:#a9bacb; --nav-active:#1b2c3d;
  --accent:#f2b432; --accent-ink:#1b1405; --accent-soft:#3a2e12;
  --ok:#3fbf83; --ok-soft:#14352a; --warn:#e9a23b; --warn-soft:#3a2a10; --bad:#f06a5f; --bad-soft:#3d1a18; --info:#69a4e6; --info-soft:#152a42;
  --c-ext:#69a4e6; --c-int:#f06a5f; --c-wait:#e9a23b; --c-qa:#b18ae6; --c-ramp:#3fbf83;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px} h4{font-size:15px;font-family:var(--f-body);font-weight:600}
a{color:var(--info)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-sb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{width:38px;height:38px;flex:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:20px;color:#fff;letter-spacing:.04em;display:block;line-height:1}
.brand span{font-size:11px;opacity:.7}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:6px;font-weight:500;font-size:14px;color:var(--nav-ink)}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;display:flex;flex-direction:column;gap:6px}
.side-foot b{color:#fff;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
.topbar .menu-btn{display:none}
.content{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.mode-chip{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.mode-cloud{background:var(--ok-soft);color:var(--ok)} .mode-local{background:var(--warn-soft);color:var(--warn)}
.demo-banner{background:repeating-linear-gradient(-45deg,var(--accent-soft) 0 12px,var(--surface) 12px 24px);border:1px solid var(--accent);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:70;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .topbar .menu-btn{display:inline-flex}
  .hide-sm{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:4px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--ink-2);margin-left:3px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .d{font-size:12px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn-xl{min-height:64px;font-size:17px;padding:0 22px;border-radius:8px}
.btn svg{width:16px;height:16px}
.icon-btn{all:unset;cursor:pointer;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:6px}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field>span .req{color:var(--bad);margin-left:2px}
.field small{font-size:11.5px;color:var(--ink-3)}
.field .err{color:var(--bad);font-size:12px}
.inp,select.inp,textarea.inp{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea.inp{min-height:72px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.inp.sm{min-height:32px;padding:4px 8px;font-size:13px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .cnt{font-size:11px;background:var(--surface-2);border-radius:9px;padding:0 6px;margin-left:5px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .inp{min-width:90px}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.01em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-grey{background:var(--surface-2);color:var(--ink-2)} .p-blue{background:var(--info-soft);color:var(--info)}
.p-amber{background:var(--warn-soft);color:var(--warn)} .p-red{background:var(--bad-soft);color:var(--bad)}
.p-green{background:var(--ok-soft);color:var(--ok)} .p-violet{background:color-mix(in srgb,var(--c-qa) 18%,transparent);color:var(--c-qa)}
.p-ink{background:var(--ink);color:var(--surface)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.crit{background:var(--bad-soft);color:var(--bad)}
.tag.demo{background:var(--accent);color:var(--accent-ink)}
.t-ext{color:var(--c-ext)} .t-int{color:var(--c-int)} .t-wait{color:var(--c-wait)} .t-qa{color:var(--c-qa)} .t-ramp{color:var(--c-ramp)}

/* Phase stepper */
.phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.phase{padding:8px 10px;border-radius:5px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-3);position:relative;min-width:0}
.phase b{display:block;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase.done{background:var(--ok-soft);color:var(--ok)}
.phase.cur{background:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){.phases{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Live board */
.live-tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--ink-3);min-width:0}
.live-tile.ok{border-left-color:var(--ok)} .live-tile.warn{border-left-color:var(--warn)} .live-tile.bad{border-left-color:var(--bad)}
.live-tile .clock{font-family:var(--f-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}

/* Live timer screen */
.big-clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(44px,9vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.act-tile{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.act-tile.run{border-color:var(--c-int);box-shadow:inset 0 0 0 1px var(--c-int);background:color-mix(in srgb,var(--c-int) 6%,var(--surface))}
.act-tile.run.wait{border-color:var(--c-wait);box-shadow:inset 0 0 0 1px var(--c-wait);background:color-mix(in srgb,var(--c-wait) 8%,var(--surface))}
.act-tile.done{opacity:.75}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--c-int);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.side{transition:none}}

/* Alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alert.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-soft)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.alert.info{background:var(--info-soft)}
.alert .ic{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--ink-3)}
.alert.bad .ic{background:var(--bad)} .alert.warn .ic{background:var(--warn)} .alert.info .ic{background:var(--info)}
.note{padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:13px}
.note.bad{background:var(--bad-soft);color:var(--ink)} .note.warn{background:var(--warn-soft)} .note.ok{background:var(--ok-soft)} .note.info{background:var(--info-soft)}
.gate-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.gate-list li{list-style:none;display:flex;gap:7px;align-items:flex-start}
.gate-list{padding:0;margin:0}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:10px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(980px,100%)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:7px;font-size:13.5px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff} .toast.ok{background:var(--ok);color:#fff}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--nav)}
.login-card{background:var(--surface);border-radius:12px;padding:26px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{min-height:54px;font-size:20px;font-family:var(--f-mono);font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink)}
.pin-dots{display:flex;gap:10px;justify-content:center;min-height:18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f-body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.photo-row{display:flex;gap:6px;flex-wrap:wrap}
.photo-row img{width:64px;height:64px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.diff-a{background:var(--bad-soft)} .diff-b{background:var(--ok-soft)}

const uid = (p='') => p + Date.now().toString(36).slice(-5).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v==='object' && !Array.isArray(v);
function deepMerge(base, patch){
  if(!isObj(base) || !isObj(patch)) return clone(patch);
  const out = {...base};
  for(const k of Object.keys(patch)){
    const pv = patch[k];
    out[k] = (isObj(pv) && isObj(base[k])) ? deepMerge(base[k], pv) : clone(pv);
  }
  return out;
}

/** Hợp các khoảng thời gian – không cộng trùng thời gian song song (KPI mục 7). */
function unionMs(intervals){
  const a = intervals.filter(i=>i && i[0]!=null && i[1]!=null && i[1]>i[0]).map(i=>[i[0],i[1]]).sort((x,y)=>x[0]-y[0]);
  let tot=0, cs=null, ce=null;
  for(const [s,e] of a){
    if(cs===null){cs=s;ce=e;}
    else if(s<=ce){ ce=Math.max(ce,e); }
    else { tot+=ce-cs; cs=s; ce=e; }
  }
  if(cs!==null) tot+=ce-cs;
  return tot;
}
function shiftWindowContains(shift, t){
  if(!shift||!t) return false;
  const d=new Date(t); const m=d.getHours()*60+d.getMinutes();
  const [sh,sm]=shift.start.split(':').map(Number), [eh,em]=shift.end.split(':').map(Number);
  const s=sh*60+sm, e=eh*60+em;
  return s<e ? (m>=s && m<e) : (m>=s || m<e);
}
async function hashPin(userId, pin){
  const txt = 'smed|'+userId+'|'+pin;
  try{
    if(crypto?.subtle){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return 'sha256:'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  }catch(e){}
  let h=2166136261; for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619);} return 'fnv:'+(h>>>0).toString(16);
}
function compressImage(file, max=420, q=0.6){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ===================== STORE: cloud (db capability) / local ===================== */
const COLLS = ['changeovers','models','sops','kaizen','auditlog'];
const LOCAL_KEY = 'smed.local.v1', PENDING_KEY='smed.pending.v1';
const Store = {
  mode:'loading', db:null, ready:false, readOnly:false,
  raw:{config:undefined, changeovers:{}, models:{}, sops:{}, kaizen:{}, auditlog:{}},
  loaded:new Set(), pending:[], fns:new Set(), chains:{}, _view:null,
  on(f){ this.fns.add(f); return ()=>this.fns.delete(f); },
  emit(){ this._view=null; this.fns.forEach(f=>f()); },
  /** Dữ liệu hiển thị = snapshot server + các thao tác chờ đồng bộ (offline queue). */
  get data(){
    if(this._view) return this._view;
    let v = this.raw;
    if(this.pending.length){
      v = {...this.raw}; for(const c of COLLS) v[c]={...this.raw[c]};
      for(const op of this.pending){
        if(op.coll==='smed') { v.config = op.kind==='set' ? clone(op.data) : deepMerge(v.config||{}, op.data); continue; }
        if(op.kind==='delete') { delete v[op.coll][op.id]; continue; }
        v[op.coll][op.id] = op.kind==='set' ? clone(op.data) : deepMerge(v[op.coll][op.id]||{}, op.data);
      }
    }
    this._view=v; return v;
  },
  get config(){ return this.data.config; },
  async init(){
    let db=null;
    try{ if(window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); }catch(e){ db=null; }
    if(db){ this.db=db; this.mode='cloud'; this.startCloud(); }
    else { this.mode='local'; this.startLocal(); }
  },
  startCloud(){
    try{ this.pending = JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ this.pending=[]; }
    const mark = k => { this.loaded.add(k); if(this.loaded.size>=COLLS.length+1) this.ready=true; this.emit(); };
    this.db.doc('smed/config').onSnapshot(s=>{ this.raw.config = s.exists ? s.data() : null; mark('config'); }, e=>{ console.warn('config sub',e); if(!this.loaded.has('config')){ this.raw.config=null; mark('config'); } });
    for(const c of COLLS){
      this.db.collection(c).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); this.raw[c]=m; mark(c); }, e=>{ console.warn('sub',c,e); mark(c); });
    }
    setInterval(()=>this.flush(), 15000);
    window.addEventListener('online', ()=>this.flush());
  },
  startLocal(){
    const load = () => { try{ const j=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null'); if(j){ this.raw={config:null, changeovers:{}, models:{}, sops:{}, kaizen:{}, auditlog:{}, ...j}; } else this.raw.config=null; }catch(e){ this.raw.config=null; } };
    load();
    const seed=window.SMED_SEED;
    if(seed && seed.data){
      this.seedInfo={at:seed.exportedAt, n:Object.keys(seed.data.changeovers||{}).length};
      if(!this.raw.config){ this.applySeed(); }
      else if((this.raw.seedAt||0) < seed.exportedAt) this.seedNewer=true;
    }
    this.ready=true; this.emit();
    window.addEventListener('storage', e=>{ if(e.key===LOCAL_KEY){ load(); this.emit(); } });
  },
  applySeed(){
    const seed=window.SMED_SEED; if(!seed) return;
    this.raw={config:null, changeovers:{}, models:{}, sops:{}, kaizen:{}, auditlog:{}, ...clone(seed.data), seedAt:seed.exportedAt};
    this.seedNewer=false; this.saveLocal(); this.emit();
  },
  saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(this.raw)); return true; }
    catch(e){ toast('Không lưu được vào bộ nhớ thiết bị (có thể đã đầy). Hãy xuất sao lưu JSON và xóa bớt ảnh.', 'bad'); return false; }
  },
  ref(coll,id){ return coll==='smed' ? this.db.doc('smed/config') : this.db.collection(coll).doc(id); },
  async write(op){
    // op: {coll,id,kind:'set'|'update'|'delete',data}
    if(this.mode==='local'){
      if(op.coll==='smed'){ this.raw.config = op.kind==='set'?clone(op.data):deepMerge(this.raw.config||{},op.data); }
      else if(op.kind==='delete'){ const m={...this.raw[op.coll]}; delete m[op.id]; this.raw[op.coll]=m; }
      else { this.raw[op.coll] = {...this.raw[op.coll], [op.id]: op.kind==='set'?clone(op.data):deepMerge(this.raw[op.coll][op.id]||{},op.data)}; }
      this.saveLocal(); this.emit(); return true;
    }
    const key = op.coll+'/'+(op.id||'config');
    const run = async () => {
      const ref = this.ref(op.coll, op.id);
      const exec = () => op.kind==='set' ? ref.set(op.data) : op.kind==='delete' ? ref.delete() : ref.update(op.data);
      try{ await exec(); return true; }
      catch(e){
        const code = e && e.code;
        if(code==='unavailable'){ await new Promise(r=>setTimeout(r, 400+Math.random()*800)); try{ await exec(); return true; }catch(e2){ return this.enqueue(op, e2); } }
        if(code==='resource_exhausted') return this.enqueue(op, e);
        if(code==='invalid_argument' && op.kind==='update'){
          // tài liệu chưa tồn tại → tạo mới bằng set (dùng cho auditlog theo tháng)
          if(op.createIfMissing){ try{ await ref.set(op.data); return true; }catch(e3){} }
          toast('Không ghi được: bạn không có quyền ghi dữ liệu dùng chung, hoặc bản ghi không còn tồn tại.', 'bad'); this.readOnly = true; this.emit(); return false;
        }
        if(code==='invalid_argument'){ toast('Không ghi được: tài khoản claude.ai của bạn chỉ có quyền xem artifact này.', 'bad'); this.readOnly=true; this.emit(); return false; }
        if(code==='quota_exceeded'){ toast('Cơ sở dữ liệu đã đầy: '+(e.message||'')+'. Hãy xuất sao lưu và xóa dữ liệu cũ.', 'bad'); return false; }
        return this.enqueue(op, e);
      }
    };
    const prev = this.chains[key] || Promise.resolve();
    const p = prev.then(run, run); this.chains[key]=p; return p;
  },
  enqueue(op, err){
    this.pending.push(op); this.persistPending(); this.emit();
    toast('Mất kết nối – thao tác được lưu tạm trên thiết bị và sẽ tự đồng bộ.', '');
    return true;
  },
  persistPending(){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(this.pending)); }catch(e){} },
  async flush(){
    if(this.mode!=='cloud' || !this.pending.length || this._flushing) return;
    this._flushing=true;
    try{
      while(this.pending.length){
        const op=this.pending[0]; const ref=this.ref(op.coll,op.id);
        try{ if(op.kind==='set') await ref.set(op.data); else if(op.kind==='delete') await ref.delete(); else { try{ await ref.update(op.data); }catch(e){ if(e.code==='invalid_argument' && op.createIfMissing) await ref.set(op.data); else throw e; } } }
        catch(e){ if(e.code==='invalid_argument'){ /* xung đột/không hợp lệ: bỏ thao tác, ghi nhận */ console.warn('drop pending',op,e); } else break; }
        this.pending.shift(); this.persistPending();
      }
    } finally { this._flushing=false; this.emit(); }
  },
  set(coll,id,data){ return this.write({coll,id,kind:'set',data}); },
  update(coll,id,data,extra={}){ return this.write({coll,id,kind:'update',data,...extra}); },
  remove(coll,id){ return this.write({coll,id,kind:'delete'}); },
  setConfig(data){ return this.write({coll:'smed',kind:'set',data}); },
  updateConfig(data){ return this.write({coll:'smed',kind:'update',data}); },
};

const modelById = id => Store.data.models[id];
const modelLabel = id => { const m=modelById(id); return m ? m.code : (id||'—'); };
function effectiveRev(model, at=Date.now()){
  if(!model) return null;
  const revs = vals(model.revisions).filter(r=>r.status==='Approved' || r.status==='Superseded').filter(r=>!r.effectiveFrom || dayStart(r.effectiveFrom)<=at);
  revs.sort((a,b)=>(dayStart(b.effectiveFrom||'2000-01-01')-dayStart(a.effectiveFrom||'2000-01-01')) || (String(b.rev)>String(a.rev)?1:-1));
  return revs[0] || null;
}
const revOf = (modelId, revKey) => { const m=modelById(modelId); return m && revKey ? m.revisions?.[revKey] : null; };
function findStandard(lineId, modelA, modelB, at=Date.now()){
  const list = (Store.config?.standards||[]).filter(s=>s.status==='Approved' && (!s.effectiveFrom || dayStart(s.effectiveFrom)<=at) && (!s.effectiveTo || dayStart(s.effectiveTo)>at));
  const ok = s => (s.lineId==='*'||s.lineId===lineId) && (s.modelA==='*'||s.modelA===modelA) && (s.modelB==='*'||s.modelB===modelB);
  const score = s => (s.lineId!=='*'?4:0)+(s.modelB!=='*'?2:0)+(s.modelA!=='*'?1:0);
  const c = list.filter(ok).sort((a,b)=>score(b)-score(a) || dayStart(b.effectiveFrom||'2000-01-01')-dayStart(a.effectiveFrom||'2000-01-01'));
  return c[0]||null;
}
function effectiveSop(sop, at=Date.now()){
  if(!sop) return null;
  const r = vals(sop.revisions).filter(r=>r.status==='Approved' || r.status==='Superseded').filter(r=>!r.effectiveFrom || dayStart(r.effectiveFrom)<=at);
  r.sort((a,b)=>dayStart(b.effectiveFrom||'2000-01-01')-dayStart(a.effectiveFrom||'2000-01-01'));
  return r[0]||null;
}
function findSopFor(modelBId){
  const sops = vals(Store.data.sops).filter(s=>s.status!=='Archived');
  return sops.find(s=>(s.models||[]).includes(modelBId) && effectiveSop(s)) || sops.find(s=>(s.models||[]).includes('*') && effectiveSop(s)) || null;
}

/* ===================== SO SÁNH A/B ===================== */
const CMP_FIELDS = [['machineType','Loại máy'],['needle','Kim'],['thread','Chỉ'],['spi','SPI'],['stitchType','Kiểu mũi'],['tooling','Tooling/cữ gá']];
function compareRevs(revA, revB){
  const rows=[];
  const opsA = (revA?.ops||[]), opsB=(revB?.ops||[]);
  const keyOf = o => (o.opCode||o.op||'').trim().toLowerCase();
  const mapA = new Map(opsA.map(o=>[keyOf(o),o]));
  const seen = new Set();
  for(const b of opsB){
    const k=keyOf(b); seen.add(k); const a=mapA.get(k);
    if(!a){ rows.push({key:'op:'+k+':add', op:b.op, seq:b.seq, field:'Công đoạn', a:'(không có)', b:'Thêm mới – '+(b.machineType||''), status:'Change required'}); continue; }
    for(const [f,l] of CMP_FIELDS){
      const va=(a[f]??'').toString().trim(), vb=(b[f]??'').toString().trim();
      const status = (!va || !vb) ? (va===vb ? 'No change' : 'Verify') : (va===vb ? 'No change' : 'Change required');
      if(!va && !vb) continue;
      rows.push({key:'op:'+k+':'+f, op:b.op, seq:b.seq, field:l, a:va||'—', b:vb||'—', status});
    }
  }
  for(const a of opsA){ const k=keyOf(a); if(!seen.has(k)) rows.push({key:'op:'+k+':rm', op:a.op, seq:a.seq, field:'Công đoạn', a:a.op+' – '+(a.machineType||''), b:'(bỏ)', status:'Change required'}); }
  const la=revA?.layout||{}, lb=revB?.layout||{};
  if(la.workers!=null || lb.workers!=null){ const st = la.workers==null||lb.workers==null ? 'Verify' : (+la.workers===+lb.workers?'No change':'Change required'); rows.push({key:'layout:workers', op:'Layout', seq:999, field:'Số người', a:la.workers??'—', b:lb.workers??'—', status:st}); }
  if(la.version || lb.version){ rows.push({key:'layout:version', op:'Layout', seq:999, field:'Layout version', a:la.version||'—', b:lb.version||'—', status: (!la.version||!lb.version)?'Verify':(la.version===lb.version?'No change':'Change required')}); }
  const qa = new Set((revA?.qcPoints||[]).map(q=>q.name)), qb=(revB?.qcPoints||[]);
  qb.filter(q=>!qa.has(q.name)).forEach(q=>rows.push({key:'qc:'+q.name, op:'Quality checkpoint', seq:1000, field:'Điểm kiểm tra mới', a:'—', b:q.name+(q.spec?' ('+q.spec+')':''), status:'Change required'}));
  if(!revA || !revB) rows.unshift({key:'rev:missing', op:'Dữ liệu', seq:0, field:'Revision', a:revA?revA.rev:'thiếu', b:revB?revB.rev:'thiếu', status:'Verify'});
  return rows.sort((x,y)=>(x.seq||0)-(y.seq||0));
}

/* ===================== KPI ENGINE (mục 7) ===================== */
function coKpi(co, now=Date.now()){
  const cfg=Store.config||{}; const ev=co.events||{};
  const endKey = cfg.kpi?.endEvent || 'firstPairApproved';
  const start = ev.lineStopAt || null;
  const endEv = endKey==='release' ? ev.releasedAt : ev.firstPairApprovedAt;
  const running = start && !endEv && ['InChangeover','AwaitingQuality','Rework'].includes(co.status);
  const internalMs = start ? ((endEv || (running?now:null)) ? (endEv||now) - start : null) : null;
  const acts = vals(co.activities);
  const internalActs = acts.filter(a=>a.type!=='External' && a.type!=='Rampup');
  const iv = a => [a.startAt, a.endAt || (a.startAt?now:null)];
  const downtimeMs = unionMs(acts.filter(a=>a.downtime).map(iv));
  const laborMs = sum(internalActs.map(a=>{const [s,e]=iv(a); return s&&e?e-s:0;}));
  const unionInternal = unionMs(internalActs.map(iv));
  const waits = acts.filter(a=>a.type==='Waiting' || a.delayCode);
  const waitByCode = {};
  const codes = [...new Set(waits.map(a=>a.delayCode||'OTH01'))];
  for(const c of codes){ waitByCode[c] = unionMs(waits.filter(a=>(a.delayCode||'OTH01')===c).map(a=>{ if(a.type==='Waiting') return iv(a); const [s,e]=iv(a); const over=(e-s)-(a.stdMin||0)*60000; return over>0?[e-over,e]:null; })); }
  const waitingMs = unionMs(acts.filter(a=>a.type==='Waiting').map(iv));
  const targetMs = co.targetMin!=null ? co.targetMin*60000 : null;
  const baselineMs = co.baselineMin!=null ? co.baselineMin*60000 : null;
  // Chuẩn bị
  const tasks = vals(co.checklist);
  const req = tasks.filter(t=>!(t.status==='NA' && t.naApprovedBy));
  const cut = start || now;
  const doneBefore = t => t.status==='Done' && t.completedAt && t.completedAt<=cut;
  const crit = req.filter(t=>t.critical), non=req.filter(t=>!t.critical);
  const pct = (a,b) => b ? a/b*100 : null;
  const trials = vals(co.trials).sort(by('seq'));
  const decided = trials.filter(t=>t.decision);
  const firstPass = decided.length ? decided[0].decision==='Pass' : null;
  const rampMs = ev.releasedAt && ev.stableAt ? ev.stableAt-ev.releasedAt : (ev.releasedAt && co.status==='Released' ? now-ev.releasedAt : null);
  const ramp = vals(co.rampup).sort(by('at'));
  const rampLoss = sum(ramp.map(r=>Math.max(0,(+r.target||0)-(+r.actual||0))));
  const rampDefects = sum(ramp.map(r=>+r.defects||0));
  return {
    start, end:endEv||null, running, internalMs, downtimeMs, laborMs, unionInternal, parallelSavedMs: Math.max(0,laborMs-unionInternal), waitingMs, waitByCode,
    targetMs, baselineMs, varianceMs: internalMs!=null&&targetMs!=null ? internalMs-targetMs : null,
    savingMs: internalMs!=null&&baselineMs!=null ? baselineMs-internalMs : null,
    reductionPct: internalMs!=null&&baselineMs ? (baselineMs-internalMs)/baselineMs*100 : null,
    prepPct: pct(req.filter(doneBefore).length, req.length), prepCritPct: pct(crit.filter(doneBefore).length, crit.length), prepNonPct: pct(non.filter(doneBefore).length, non.length),
    prepDoneNow: pct(req.filter(t=>t.status==='Done').length, req.length),
    tasksTotal:req.length, critOpen: crit.filter(t=>t.status!=='Done').length, blocked: tasks.filter(t=>t.status==='Blocked').length,
    firstPass, trialsCount:trials.length, rampMs, rampLoss, rampDefects,
    met: internalMs!=null && targetMs!=null && !running ? internalMs <= targetMs*(1+(cfg.kpi?.targetTolerancePct||0)/100) : null,
  };
}
const kpiValid = co => co.status!=='Cancelled' && !co.excludeKpi?.approvedBy && !!co.events?.lineStopAt && !!(co.events?.firstPairApprovedAt || co.events?.releasedAt);
function aggregateKpi(list){
  const valid = list.filter(kpiValid);
  const ks = valid.map(c=>({c, k:coKpi(c)}));
  const withT = ks.filter(x=>x.k.met!=null);
  const qa = list.map(c=>coKpi(c)).filter(k=>k.firstPass!=null);
  const prep = list.filter(c=>c.events?.lineStopAt).map(c=>coKpi(c)).filter(k=>k.prepPct!=null);
  const avg = a => a.length ? sum(a)/a.length : null;
  return {
    total: list.filter(c=>c.status!=='Cancelled').length, valid: valid.length,
    avgInternal: avg(ks.map(x=>x.k.internalMs)),
    targetAch: withT.length ? withT.filter(x=>x.k.met).length/withT.length*100 : null,
    fpRate: qa.length ? qa.filter(k=>k.firstPass).length/qa.length*100 : null,
    prepAvg: avg(prep.map(k=>k.prepPct)),
    avgSaving: avg(ks.filter(x=>x.k.savingMs!=null).map(x=>x.k.savingMs)),
    avgReduction: avg(ks.filter(x=>x.k.reductionPct!=null).map(x=>x.k.reductionPct)),
    avgRamp: avg(list.filter(c=>c.events?.stableAt).map(c=>coKpi(c).rampMs)),
    totalDowntime: sum(ks.map(x=>x.k.downtimeMs)),
  };
}
function paretoDelay(list){
  const m={};
  for(const c of list){ if(c.status==='Cancelled') continue; const k=coKpi(c); for(const [code,ms] of Object.entries(k.waitByCode)){ if(!ms) continue; m[code]=m[code]||{code,ms:0,count:0,cos:new Set()}; m[code].ms+=ms; m[code].count++; m[code].cos.add(c.id); } }
  const arr=Object.values(m).sort((a,b)=>b.ms-a.ms); const tot=sum(arr.map(a=>a.ms)); let acc=0;
  return arr.map(a=>{acc+=a.ms; return {...a, cos:[...a.cos], pct:tot?a.ms/tot*100:0, cum:tot?acc/tot*100:0};});
}
function stableCheck(co){
  const sc=stableCfg(co.lineId); const r=vals(co.rampup).sort(by('at'));
  const n=+sc.consecutive||2; if(r.length<n) return {met:false, sc, last:r.slice(-n)};
  const last=r.slice(-n);
  const ok = last.every(x=> (+x.target>0) && (+x.actual >= +x.target*(+sc.minOutputPct||0)/100) && ((+x.defects||0) <= (+sc.maxDefects||0)));
  return {met:ok, sc, last};
}

/* ===================== ALERTS (mục 8) ===================== */
function computeAlerts(now=Date.now()){
  const out=[]; const d=Store.data; const cfg=Store.config; if(!cfg) return out;
  const u=me();
  for(const co of vals(d.changeovers)){
    if(!ACTIVE_STATUSES.includes(co.status)) continue;
    if(u && !inScope(co.lineId,u)) continue;
    const ac=alertCfg(co.lineId); const k=coKpi(co,now);
    const label = `${co.id} · ${lineName(co.lineId)}`;
    if(['Planned','Preparing','Ready'].includes(co.status) && co.plannedStart){
      const left = co.plannedStart-now;
      const crit = vals(co.checklist).filter(t=>t.critical && t.status!=='Done' && !(t.status==='NA'&&t.naApprovedBy));
      if(crit.length && !co.exception?.approvedBy && left < (ac.prepWarnMin||30)*60000)
        out.push({sev: left<0?'bad':'warn', type:'prep', co:co.id, roles:['leader','material','tech','prod'], title:`${crit.length} hạng mục critical chưa xong`, sub:`${label} · ${left<0?'đã quá giờ dừng':'còn '+Math.round(left/60000)+' phút tới giờ dừng'}`});
    }
    for(const t of vals(co.checklist)){
      if(t.status==='Blocked') out.push({sev:'bad', type:'blocked', co:co.id, task:t.id, roles:['prod','leader',t.ownerRole], title:`Chuẩn bị bị chặn: ${t.desc}`, sub:`${label} · ${t.blockReason||'chưa ghi lý do'} → escalate Production Manager`});
      else if(t.dueAt && t.dueAt<now && !['Done','NA'].includes(t.status) && ['Planned','Preparing','Ready'].includes(co.status)) out.push({sev:'warn', type:'overdue', co:co.id, task:t.id, roles:[t.ownerRole,'leader'], title:`Tác vụ quá hạn: ${t.desc}`, sub:`${label} · hạn ${fmtDT(t.dueAt)} · ${ROLES[t.ownerRole]||''}`});
    }
    if(k.running && k.targetMs){
      const r = k.internalMs/k.targetMs*100;
      if(r>= (ac.overTargetPct||100)) out.push({sev:'bad', type:'over', co:co.id, roles:['leader','prod','lean'], title:`Vượt target: ${fmtMin(k.internalMs,0)}/${co.targetMin} phút`, sub:`${label} · cần gắn reason code và mở review`});
      else if(r>=(ac.warnTargetPct||80)) out.push({sev:'warn', type:'near', co:co.id, roles:['leader','prod'], title:`Sắp chạm target (${Math.round(r)}%)`, sub:label});
    }
    if(co.status==='AwaitingQuality'){
      const tr=vals(co.trials).sort(by('seq')).pop();
      if(tr && !tr.decision && now-tr.sentAt > (ac.qaWaitMin||15)*60000) out.push({sev:'bad', type:'qa', co:co.id, roles:['qa','prod'], title:`Chờ QA ${Math.round((now-tr.sentAt)/60000)} phút (lần thử ${tr.seq})`, sub:`${label} · cảnh báo ưu tiên`});
      if(co.events?.firstPairApprovedAt && !co.events?.releasedAt) out.push({sev:'info', type:'release', co:co.id, roles:['prod','qa'], title:'QA đã Pass – chờ release sản xuất', sub:label});
    }
    if(co.status==='Rework') out.push({sev:'bad', type:'fail', co:co.id, roles:['qa','tech','prod','leader'], title:`First Pair không đạt – cần sửa và thử lại`, sub:`${label} · lần thử ${k.trialsCount}`});
    if(co.escalated && !['Released','StableRun','Closed'].includes(co.status)) out.push({sev:'bad', type:'esc', co:co.id, roles:['qa','prod','tech'], title:'Escalation: lỗi lặp lại / vượt số lần thử', sub:label});
    if(co.status==='Released'){ const s=stableCheck(co); if(s.met) out.push({sev:'info', type:'stable', co:co.id, roles:['ie','prod'], title:'Đạt tiêu chí ổn định – chờ xác nhận Stable Run', sub:label}); }
  }
  for(const kz of vals(d.kaizen)){
    if(['Verified','Cancelled'].includes(kz.status)) continue;
    if(kz.due && dayStart(kz.due)+86400000 < now) out.push({sev:'warn', type:'kaizen', kz:kz.id, roles:['lean'], users:[kz.owner], title:`Kaizen quá hạn: ${kz.title}`, sub:`${kz.id} · ${userName(kz.owner)} · hạn ${kz.due}`});
  }
  for(const s of vals(d.sops)){
    const r=effectiveSop(s); if(!r?.reviewDate) continue;
    const left=dayStart(r.reviewDate)-now; const days=(alertCfg().sopReviewDays||14);
    if(left < days*86400000) out.push({sev:left<0?'bad':'warn', type:'sop', sop:s.id, roles:['lean','ie'], title:`SOP ${left<0?'đã quá':'sắp tới'} hạn review: ${s.code}`, sub:`${s.name} · rev ${r.rev} · ${r.reviewDate}`});
  }
  const rank={bad:0,warn:1,info:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}
const alertsForMe = (list) => { const u=me(); if(!u) return []; if(['admin','mgmt','lean','prod'].includes(u.role)) return list; return list.filter(a=>(a.roles||[]).includes(u.role) || (a.users||[]).includes(u.id)); };
/* ===================== ĐA NGÔN NGỮ: Tiếng Việt / English / 한국어 =====================
   Giao diện được viết bằng tiếng Việt; lớp này dịch văn bản hiển thị (text, placeholder, title, aria-label)
   theo từ điển I18N_ROWS. Dữ liệu người dùng nhập (tên, ghi chú, checklist tự tạo…) giữ nguyên. */
const LANGS = {vi:{l:'Tiếng Việt', s:'VI'}, en:{l:'English', s:'EN'}, ko:{l:'한국어', s:'KO'}};
const LANG_KEY='smed.lang.v1';
const I18N = {
  lang:'vi', maps:{}, pats:{}, cache:{},
  init(){
    for(const [i,code] of [[1,'en'],[2,'ko']]){
      const m=new Map(), p=[];
      for(const r of I18N_ROWS){
        if(!r[i]) continue;
        if(/\{\d\}/.test(r[0])){
          const re=new RegExp('^'+r[0].replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\d)\}/g,'([\\s\\S]*?)')+'$');
          const order=[...r[0].matchAll(/\{(\d)\}/g)].map(x=>+x[1]);
          p.push({re, out:r[i], order});
        } else m.set(r[0], r[i]);
      }
      p.sort((a,b)=>b.re.source.length-a.re.source.length);
      this.maps[code]=m; this.pats[code]=p; this.cache[code]=new Map();
    }
    let l='vi'; try{ l=localStorage.getItem(LANG_KEY)||'vi'; }catch(e){}
    this.lang = LANGS[l] ? l : 'vi';
    document.documentElement.lang=this.lang;
  },
  core(s){
    const L=this.lang, m=this.maps[L];
    if(m.has(s)) return m.get(s);
    for(const p of this.pats[L]){
      const g=s.match(p.re); if(!g) continue;
      let out=p.out; p.order.forEach((n,idx)=>{ out=out.split('{'+n+'}').join(this.tr(g[idx+1])); });
      return out;
    }
    for(const sep of [' – ',' | ']){ if(s.includes(sep)){ const parts=s.split(sep); const t=parts.map(x=>this.tr(x)); if(t.some((x,i)=>x!==parts[i])) return t.join(sep); } }
    if(s.includes(' · ')) { const parts=s.split(' · '); if(parts.length>1){ const t=parts.map(x=>this.tr(x)); if(t.some((x,i)=>x!==parts[i])) return t.join(' · '); } }
    const ci=s.indexOf(': ');
    if(ci>0){ const a=s.slice(0,ci), b=s.slice(ci+2); if(m.has(a)||m.has(a+':')) return (m.get(a)||m.get(a+':').replace(/:$/,''))+': '+this.tr(b); }
    // tiền tố đã biết + phần còn lại không có chữ tiếng Việt (vd. "Đã lưu nháp CO-…")
    const sp=s.lastIndexOf(' ');
    for(let k=sp; k>0; k=s.lastIndexOf(' ',k-1)){
      const a=s.slice(0,k), rest=s.slice(k);
      if(m.has(a) && !/[À-ỹđĐ]/.test(rest)) return m.get(a)+rest;
    }
    if(s.startsWith('· ')) { const t=this.tr(s.slice(2)); if(t!==s.slice(2)) return '· '+t; }
    if(s.startsWith('→ ')) { const t=this.tr(s.slice(2)); if(t!==s.slice(2)) return '→ '+t; }
    return s;
  },
  tr(s){
    if(this.lang==='vi' || s==null) return s;
    s=String(s); if(!/[À-ỹđĐ]/.test(s) && !this.maps[this.lang].has(s.trim())) return s;
    const c=this.cache[this.lang]; if(c.has(s)) return c.get(s);
    const mm=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const core=mm[2];
    const out = core ? mm[1]+this.core(core)+mm[3] : s;
    if(c.size>20000) c.clear(); c.set(s,out); return out;
  },
  /* ---- áp vào DOM ---- */
  ATTRS:['placeholder','title','aria-label'],
  node(n){
    if(n.nodeType===3){
      const cur=n.data; if(n.__tr===cur) return;
      n.__vi=cur; const t=this.tr(cur); n.__tr=t; if(t!==cur) n.data=t; return;
    }
    if(n.nodeType!==1) return;
    const tag=n.tagName; if(tag==='SCRIPT'||tag==='STYLE'||n.hasAttribute('data-notr')) return;
    for(const a of this.ATTRS) if(n.hasAttribute(a)) this.attr(n,a);
    if(tag==='TEXTAREA') return;
    for(let c=n.firstChild; c; c=c.nextSibling) this.node(c);
  },
  attr(n,a){
    const cur=n.getAttribute(a); const k='__tr_'+a; if(n[k]===cur) return;
    n['__vi_'+a]=cur; const t=this.tr(cur); n[k]=t; if(t!==cur) n.setAttribute(a,t);
  },
  retranslate(root=document.body){
    const walk=n=>{
      if(n.nodeType===3){ if(n.__vi!=null){ const t=this.tr(n.__vi); n.__tr=t; n.data=t; } else this.node(n); return; }
      if(n.nodeType!==1) return;
      const tag=n.tagName; if(tag==='SCRIPT'||tag==='STYLE'||n.hasAttribute('data-notr')) return;
      for(const a of this.ATTRS){ if(!n.hasAttribute(a)) continue; const o=n['__vi_'+a]; if(o!=null){ const t=this.tr(o); n['__tr_'+a]=t; n.setAttribute(a,t); } else this.attr(n,a); }
      if(tag==='TEXTAREA') return;
      for(let c=n.firstChild; c; c=c.nextSibling) walk(c);
    };
    walk(root);
  },
  observe(){
    const mo=new MutationObserver(recs=>{
      if(this.lang==='vi') return;
      for(const r of recs){
        if(r.type==='characterData'){ if(!r.target.parentElement?.closest('textarea')) this.node(r.target); }
        else if(r.type==='attributes') this.attr(r.target, r.attributeName);
        else r.addedNodes.forEach(x=>this.node(x));
      }
    });
    mo.observe(document.body,{subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:this.ATTRS});
  },
  set(l){
    if(!LANGS[l]) return; this.lang=l; document.documentElement.lang=l;
    try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
    this.retranslate();
  },
};
const tr = s => I18N.tr(s);
I18N.init();

function LangPicker({dark}){
  const [l,setL]=useState(I18N.lang);
  return html`<select class="inp sm" data-notr="1" aria-label="Language" value=${l} style=${'width:auto;min-height:34px;font-weight:600'+(dark?';background:transparent;color:#fff;border-color:rgba(255,255,255,.25)':'')}
    onChange=${e=>{ const v=e.target.value; setL(v); I18N.set(v); }}>
    ${Object.entries(LANGS).map(([k,v])=>html`<option value=${k} style="color:#14202c">${v.s} · ${v.l}</option>`)}</select>`;
}

const ROLE_SLOT = {leader:'leader', ie:'ie', tech:'tech', qa:'qa', material:'material'};
const coById = id => Store.data.changeovers[id];

function newCoId(lineId, t=Date.now()){
  const d=new Date(t); const s=`${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  let id; do { id=`CO-${s}-${lineId}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; } while(Store.data.changeovers[id]);
  return id;
}
function coPatch(co, patch, action, extra){
  const e = auditEntry(action, co.id, extra);
  return Store.update('changeovers', co.id, {...patch, updatedAt:Date.now(), audit:{[e.id]:e}});
}
function approvalRec(action, note){ const u=me(); const id=uid('AP'); return {[id]:{id, at:Date.now(), by:u?.id, byName:u?.name, role:u?.role, action, note:note||''}}; }

function buildChecklist(co){
  const tpl = Store.config?.checklistTemplate||[];
  const out={}; let n=0;
  for(const t of tpl){
    n++; const id='PREP-'+String(n).padStart(3,'0');
    out[id]={id, tplId:t.id, cat:t.cat, desc:t.desc, type:t.type, ownerRole:t.ownerRole, ownerUser: co.assigned?.[ROLE_SLOT[t.ownerRole]]||null,
      critical:!!t.critical, acceptance:t.acceptance||'', dueOffsetMin:t.dueOffsetMin||0, dueAt: co.plannedStart ? co.plannedStart-(t.dueOffsetMin||0)*60000 : null,
      status:'NotStarted', evidence:'', photos:[], order:n};
  }
  return {checklist:out, taskSeq:n};
}
function buildComparison(co){
  const at = co.plannedStart||Date.now();
  const mA=modelById(co.modelA), mB=modelById(co.modelB);
  const rA=effectiveRev(mA,at), rB=effectiveRev(mB,at);
  const rows={};
  for(const r of compareRevs(rA,rB)){ rows[r.key.replace(/[^A-Za-z0-9_:\-]/g,'_')] = {...r, key:r.key}; }
  const keyOf = m => m ? Object.keys(m.revisions||{}).find(k=>m.revisions[k]===effectiveRev(m,at)) : null;
  return { refs:{ modelA:{id:co.modelA, rev:rA?.rev||null, revKey:keyOf(mA)}, modelB:{id:co.modelB, rev:rB?.rev||null, revKey:keyOf(mB)} }, comparison:{generatedAt:Date.now(), rows} };
}

/** Kiểm tra điều kiện chuyển trạng thái. Trả về danh sách {ok, text}. */
function gateCheck(co, to){
  const g=[]; const add=(ok,text)=>g.push({ok:!!ok,text});
  const cfg=Store.config; const u=me();
  if(to==='Planned'){
    add(can('co.plan'), 'Người xác nhận có quyền lập kế hoạch (Production Manager)');
    add(co.lineId && (cfg.lines||[]).some(l=>l.id===co.lineId && l.status!=='Inactive'), 'Chuyền đang active');
    add(inScope(co.lineId), 'Chuyền nằm trong phạm vi phân quyền của bạn');
    add(co.shiftId, 'Đã chọn ca');
    add(co.modelA, 'Đã chọn Model A');
    add(co.modelB, 'Đã chọn Model B');
    add(!co.modelA || !co.modelB || co.modelA!==co.modelB || co.reSetup, 'Model A khác Model B (hoặc đánh dấu re-setup)');
    const sh=(cfg.shifts||[]).find(s=>s.id===co.shiftId);
    add(co.plannedStart && sh && shiftWindowContains(sh, co.plannedStart), 'Giờ bắt đầu nằm trong ca sản xuất hợp lệ');
    add(co.targetMin>0, 'Có target internal time');
    add(!co.targetOverride || (co.targetOverride.reason && co.targetOverride.by), 'Ghi đè target có lý do và người có quyền');
    const ow=(cfg.users||[]).find(x=>x.id===co.owner);
    add(ow && ow.active!==false, 'Changeover owner là người dùng đang active');
    for(const r of ['leader','ie','tech','qa','material']) add(co.assigned?.[r], `Đã phân công ${ROLES[r]}`);
  }
  if(to==='Preparing'){ add(can('checklist.edit')||can('co.plan'), 'Có quyền bắt đầu chuẩn bị'); add(vals(co.checklist).length>0, 'Checklist đã được tạo'); }
  if(to==='Ready'){
    add(can('co.ready'), can('co.ready')?'Line Leader xác nhận sẵn sàng dừng':`Line Leader xác nhận sẵn sàng dừng – ${userName(co.assigned?.leader)} cần đăng nhập để bấm`);
    const crit = vals(co.checklist).filter(t=>t.critical);
    const open = crit.filter(t=>!(t.status==='Done' || (t.status==='NA' && t.naApprovedBy)));
    const exc = co.exception?.approvedBy;
    add(open.length===0 || exc, open.length ? `Còn ${open.length} hạng mục critical chưa xong${exc?' (đã có exception được duyệt)':''}` : 'Tất cả hạng mục critical đã hoàn tất');
    const rows = vals(co.comparison?.rows);
    const openRows = rows.filter(r => (r.status==='Change required' && !(r.taskId && co.checklist?.[r.taskId]?.status==='Done') && !r.confirmedBy) || (r.status==='Verify' && !r.confirmedBy));
    add(openRows.length===0 || exc, openRows.length ? `Còn ${openRows.length} khác biệt A/B chưa đóng (tab So sánh A/B – IE/Technician/QA xác minh)` : 'So sánh A/B đã đóng hết');
  }
  if(to==='InChangeover') add(can('co.execute'), 'Có quyền thực hiện changeover');
  if(to==='Released'){
    const tr=vals(co.trials).filter(t=>t.decision).sort(by('seq')).pop();
    add(can('release'), 'Có quyền release (Production/QA)');
    add(tr && tr.decision==='Pass', 'Lần thử gần nhất được QA Pass');
    add(!vals(co.trials).some(t=>!t.decision), 'Không còn mẫu thử đang chờ quyết định');
  }
  if(to==='StableRun'){ add(can('stable.confirm'), 'IE/Production xác nhận'); const s=stableCheck(co); add(s.met || co.stableOverride?.reason, s.met?'Đạt tiêu chí ổn định đã duyệt':'Chưa đạt tiêu chí ổn định (cần lý do ghi đè)'); }
  if(to==='Closed'){
    add(can('co.close'), 'Có quyền review & đóng (Lean/Production)');
    const acts=vals(co.activities);
    add(!acts.some(a=>!a.endAt), 'Tất cả hoạt động đã dừng bấm giờ');
    add(!acts.some(a=>a.type==='Waiting' && !a.delayCode), 'Mọi khoảng chờ đều có delay code');
    add(co.review?.summary, 'Đã nhập tóm tắt review');
    const k=coKpi(co); add(k.met!==false || (co.review?.overReason), 'Vượt target: đã gắn reason code/giải thích');
  }
  return g;
}
const gateOk = g => g.every(x=>x.ok);

async function transition(co, to, {note, extraPatch}={}){
  const g = gateCheck({...co, ...(extraPatch||{})}, to);
  if(!gateOk(g)){ toast('Chưa đủ điều kiện: '+g.filter(x=>!x.ok).map(x=>x.text).join('; '), 'bad'); return false; }
  const now=Date.now(); const ev={};
  const evMap = {Planned:'plannedAt',Preparing:'prepStartAt',Ready:'readyAt',InChangeover:'lineStopAt',Released:'releasedAt',StableRun:'stableAt',Closed:'closedAt'};
  if(evMap[to]) ev[evMap[to]]=now;
  let patch = {status:to, statusAt:now, events:ev, approvals:approvalRec('→ '+(STATUS[to]?.l||to), note), ...(extraPatch||{})};
  if(to==='Planned'){
    Object.assign(patch, buildComparison(co));
    if(!vals(co.checklist).length) Object.assign(patch, buildChecklist(co));
    const sop = findSopFor(co.modelB); if(sop){ const r=effectiveSop(sop); const rk=Object.keys(sop.revisions||{}).find(k=>sop.revisions[k]===r); patch.refs = {...(patch.refs||{}), sop:{id:sop.id, rev:r.rev, revKey:rk}}; }
  }
  if(to==='Closed'){ patch.review = {...(co.review||{}), ...(extraPatch?.review||{}), kpiSnapshot: snapshotKpi(co), closedBy:me()?.id, closedAt:now}; }
  await coPatch(co, patch, 'status', {before:co.status, after:to, reason:note});
  toast(`${co.id}: ${STATUS[to]?.l||to}`, 'ok');
  return true;
}
function snapshotKpi(co){ const k=coKpi(co); return {internalMin:mins(k.internalMs), downtimeMin:mins(k.downtimeMs), laborMin:mins(k.laborMs), waitingMin:mins(k.waitingMs), targetMin:co.targetMin, baselineMin:co.baselineMin, met:k.met, firstPass:k.firstPass, trials:k.trialsCount, prepPct:k.prepPct, prepCritPct:k.prepCritPct, rampMin:mins(k.rampMs), rampLoss:k.rampLoss, at:Date.now()}; }
async function cancelCo(co, reason){
  if(!canOn('co.cancel',co)) return toast('Bạn không có quyền hủy changeover này.','bad');
  if(!reason?.trim()) return toast('Cần ghi lý do hủy.','bad');
  await coPatch(co, {status:'Cancelled', statusAt:Date.now(), events:{cancelledAt:Date.now()}, cancel:{reason, by:me().id, at:Date.now(), fromStatus:co.status}, approvals:approvalRec('Hủy', reason)}, 'cancel', {before:co.status, after:'Cancelled', reason});
  toast('Đã hủy '+co.id);
}

/* ---------- Checklist ---------- */
function canUpdateTask(co, t, u=me()){
  if(!u || !canOn('checklist.update',co,u)) return false;
  if(['Closed','Cancelled'].includes(co.status)) return false;
  if(['prod','leader','lean','ie'].includes(u.role)) return true;
  return t.ownerRole===u.role || t.ownerUser===u.id;
}
async function updateTask(co, t, patch, action='task', reason){
  if(!canUpdateTask(co,t)) return toast('Tác vụ này không được giao cho bạn hoặc ngoài phạm vi quyền.','bad');
  if(patch.status==='Done' && t.critical && !(patch.evidence ?? t.evidence) && !(t.photos||[]).length && !(patch.photos||[]).length) return toast('Hạng mục critical cần bằng chứng (mã vật tư/tooling, kết quả đo hoặc ảnh) trước khi hoàn thành.','bad');
  if(patch.status==='Blocked' && !(patch.blockReason||t.blockReason)) return toast('Cần ghi lý do bị chặn.','bad');
  if(patch.status==='NA' && !(patch.naReason||'').trim()) return toast('N/A cần lý do.','bad');
  const now=Date.now(); const u=me();
  const p={...patch};
  if(patch.status==='Done'){ p.completedAt=now; p.completedBy=u.id; }
  if(patch.status && patch.status!=='Done'){ p.completedAt=null; p.verifiedBy=null; p.verifiedAt=null; }
  if(patch.status==='NA'){ p.naRequestedBy=u.id; p.naApprovedBy=null; }
  if(patch.status==='Blocked'){ p.blockedAt=now; p.escalatedAt=now; }
  await coPatch(co, {checklist:{[t.id]:p}}, action, {field:t.id, before:t.status, after:patch.status||null, reason: reason||patch.naReason||patch.blockReason});
}
async function verifyTask(co,t){
  if(!canOn('checklist.verify',co)) return toast('Chỉ Line Leader / Production xác nhận tác vụ.','bad');
  if(t.status!=='Done') return toast('Tác vụ chưa hoàn thành.','bad');
  if(t.completedBy===me().id && t.critical) return toast('Hạng mục critical cần người khác xác nhận (không tự xác nhận).','bad');
  await coPatch(co, {checklist:{[t.id]:{verifiedBy:me().id, verifiedAt:Date.now()}}}, 'verify', {field:t.id});
}
async function approveNA(co,t){
  if(!canOn('na.approve',co)) return toast('Chỉ Production/Lean Manager duyệt N/A.','bad');
  await coPatch(co, {checklist:{[t.id]:{naApprovedBy:me().id, naApprovedAt:Date.now()}}, approvals:approvalRec('Duyệt N/A '+t.id, t.naReason)}, 'na.approve', {field:t.id, reason:t.naReason});
}
async function addTask(co, data){

    critical:!!data.critical, acceptance:data.acceptance||'', dueAt:data.dueAt|| (co.plannedStart? co.plannedStart-30*60000:null), status:'NotStarted', evidence:'', photos:[], order:n, source:data.source||'manual', cmpKey:data.cmpKey||null};

async function editActivity(co, act, patch, reason){
  const closed = co.status==='Closed';
  const timeChanged = ('startAt' in patch && patch.startAt!==act.startAt) || ('endAt' in patch && patch.endAt!==act.endAt);
  if(timeChanged){
    if(!can(closed?'time.edit.closed':'time.edit') || !inScope(co.lineId)) return toast(closed?'Sửa thời gian sau khi đóng cần quyền Lean Manager/Admin.':'Sửa thời gian cần quyền IE/Lean.','bad'), false;
    if(!reason?.trim()) return toast('Sửa thời gian bắt buộc ghi lý do.','bad'), false;
    if(patch.endAt && patch.startAt && patch.endAt<=patch.startAt) return toast('Giờ kết thúc phải sau giờ bắt đầu.','bad'), false;
  } else if(!canOn('co.execute',co) && !can('time.edit')) return toast('Bạn không có quyền sửa.','bad'), false;
  const p={...patch}; if(timeChanged){ p.manualEdit={by:me().id, at:Date.now(), reason}; }
  const extraPatch = closed && timeChanged ? {review:{editedAfterClose:true}} : {};
  await coPatch(co, {activities:{[act.id]:p}, ...extraPatch}, timeChanged?'time.edit':'activity.edit', {field:act.id, before:{startAt:act.startAt,endAt:act.endAt,delayCode:act.delayCode}, after:{startAt:patch.startAt??act.startAt, endAt:patch.endAt??act.endAt, delayCode:patch.delayCode??act.delayCode}, reason});
  if(closed && timeChanged){ const fresh=coById(co.id); await Store.update('changeovers', co.id, {review:{kpiSnapshot:snapshotKpi(fresh), kpiRecalcAt:Date.now()}}); }
  return true;

async function sendTrial(co){
  if(!canOn('co.execute',co)) return toast('Bạn không có quyền gửi mẫu thử.','bad');
  if(vals(co.trials).some(t=>!t.decision)) return toast('Đang có mẫu thử chờ QA quyết định.','bad');
  if(!['InChangeover','Rework'].includes(co.status)) return toast('Chỉ gửi mẫu thử khi đang changeover hoặc sau khi sửa.','bad');
  if(co.status==='Rework'){ const last=vals(co.trials).sort(by('seq')).pop(); if(last && !vals(last.corrections).length) return toast('Ghi ít nhất một hành động sửa (tab Quality Gate) trước khi thử lại.','bad'); }
  const seq=vals(co.trials).length+1; const id='TR'+seq; const now=Date.now();
  const qaAct=uid('ACT');
  const patch={status:'AwaitingQuality', statusAt:now,
    trials:{[id]:{id, seq, sentAt:now, sentBy:me().id, checks:{}, defects:{}, corrections:{}, decision:null, qaActId:qaAct}},
    activities:{[qaAct]:{id:qaAct, name:`QA kiểm tra mẫu lần ${seq}`, type:'Quality', startAt:now, endAt:null, startBy:me().id, team:'QA', downtime:true, auto:true}},
    events: seq===1 ? {firstTrialAt:now} : {}};
  await coPatch(co, patch, 'trial.send', {field:id, before:co.status, after:'AwaitingQuality'});
  toast(`Đã gửi mẫu thử lần ${seq} cho QA`, 'ok');
}
async function decideTrial(co, tr, {decision, note, checks, defects}){
  if(!canOn('qa.decide',co)) return toast('Chỉ QA được quyết định First Pair.','bad');
  if(tr.decision) return toast('Kết quả lần thử đã khóa – không ghi đè. Hãy tạo lần thử mới.','bad');
  if(['Fail','Rework'].includes(decision) && !Object.keys(defects||{}).length) return toast('Fail/Rework bắt buộc ghi ít nhất một lỗi.','bad');
  const qcPts = (revOf(co.refs?.modelB?.id, co.refs?.modelB?.revKey)?.qcPoints)||[];
  if(decision==='Pass'){
    const missing = qcPts.filter(q=>q.critical && checks?.[q.id]!=='OK');
    if(missing.length) return toast('Chưa thể Pass: điểm kiểm tra critical chưa OK – '+missing.map(q=>q.name).join(', '),'bad');
  }
  const now=Date.now();
  const patch={trials:{[tr.id]:{decision, note:note||'', checks:checks||{}, defects:defects||{}, decidedBy:me().id, decidedAt:now}}, approvals:approvalRec('QA '+decision+' lần '+tr.seq, note)};
  if(tr.qaActId && co.activities?.[tr.qaActId] && !co.activities[tr.qaActId].endAt) patch.activities={[tr.qaActId]:{endAt:now, endBy:me().id}};
  if(decision==='Pass'){ patch.events={...(co.events?.firstPairApprovedAt?{}:{firstPairApprovedAt:now})}; patch.hold=false; }
  else if(decision==='Hold'){ patch.hold=true; }
  else { patch.status='Rework'; patch.statusAt=now; }
  // Escalation: vượt số lần thử hoặc lỗi lặp lại
  const prevCodes = new Set(vals(co.trials).filter(t=>t.decision && t.id!==tr.id).flatMap(t=>vals(t.defects).map(d=>d.code)));
  const repeat = vals(defects||{}).some(d=>prevCodes.has(d.code));
  if(decision!=='Pass' && (tr.seq >= (alertCfg(co.lineId).maxTrials||3) || repeat)) patch.escalated = {at:now, reason: repeat?'Lỗi lặp lại':'Vượt giới hạn số lần thử'};
  await coPatch(co, patch, 'qa.decision', {field:tr.id, after:decision, reason:note});
  toast(`QA: ${decision} – lần thử ${tr.seq}`, decision==='Pass'?'ok':'bad');
}
async function addCorrection(co, tr, text){
  if(!canOn('co.execute',co) && !canOn('qa.decide',co)) return toast('Không có quyền.','bad');
  const id=uid('CR');
  await coPatch(co, {trials:{[tr.id]:{corrections:{[id]:{id, action:text, by:me().id, at:Date.now()}}}}}, 'trial.correction', {field:tr.id, after:text});
}

function Gantt({co, now=Date.now()}){
  const acts=vals(co.activities).filter(a=>a.startAt).sort(by('startAt'));
  if(!acts.length) return html`<${Empty} title="Chưa có hoạt động nào được bấm giờ"><//>`;
  const t0=Math.min(...acts.map(a=>a.startAt), co.events?.lineStopAt||Infinity);
  const t1=Math.max(...acts.map(a=>a.endAt||now), co.events?.releasedAt||0, co.events?.firstPairApprovedAt||0);
  const W=760, rowH=22, pl=230, pr=16, top=30; const H=top+acts.length*rowH+52; const span=Math.max(60000,t1-t0);
  const x=t=>pl+(W-pl-pr)*((t-t0)/span); const step = span>7200000?1800000:span>3600000?900000:span>1200000?300000:60000;
  const ticks=[]; for(let t=0;t<=span;t+=step) ticks.push(t);
  const trunc=s=>{ s=tr(s); return s.length>32?s.slice(0,31)+'…':s; };
  const ev=co.events||{};
  const marks=[[ev.lineStopAt,'Dừng chuyền'],[ev.firstPairApprovedAt,'QA Pass'],[ev.releasedAt,'Release']].filter(m=>m[0]);
  return html`<div class="tbl-wrap" style="border:0"><svg class="chart" viewBox=${`0 0 ${W} ${H}`} style="min-width:620px" role="img" aria-label="Biểu đồ thời gian hoạt động">
    ${ticks.map(t=>html`<line class="gridl" x1=${x(t0+t)} x2=${x(t0+t)} y1=${top-6} y2=${H-30}/><text x=${x(t0+t)} y=${top-10} text-anchor="middle">${Math.round(t/60000)}′</text>`)}
    ${acts.map((a,i)=>html`<g>
      <text x=${pl-8} y=${top+i*rowH+15} text-anchor="end" style="fill:var(--ink)">${trunc(a.name)}</text>
      <rect x=${x(a.startAt)} y=${top+i*rowH+4} width=${Math.max(2,x(a.endAt||now)-x(a.startAt))} height=${rowH-8} rx="3" fill=${ACT_TYPES[a.type]?.col||'var(--ink-3)'} opacity=${a.endAt?0.9:0.55}><title>${a.name}: ${fmtMin((a.endAt||now)-a.startAt)} phút${a.delayCode?' · '+a.delayCode:''}</title></rect></g>`)}
    ${marks.map(([t,l],i)=>html`<line x1=${x(t)} x2=${x(t)} y1=${top-4} y2=${H-14-i*13} stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x=${x(t)>W-110?x(t)-4:x(t)+4} y=${H-6-i*13} text-anchor=${x(t)>W-110?'end':'start'} style="fill:var(--ink);font-weight:600">${l}</text>`)}
  </svg></div>`;
}
function TrendChart({points, height=220}){
  if(!points.length) return html`<${Empty} title="Chưa có changeover hoàn tất trong khoảng lọc"><//>`;
  const W=640,H=height,pl=40,pr=12,pt=12,pb=34; const maxV=Math.max(...points.map(p=>Math.max(p.y||0,p.t||0)))*1.1||10;
  const x=i=>pl+(W-pl-pr)*(points.length===1?0.5:i/(points.length-1)); const y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const ticks=[0,Math.round(maxV/2),Math.round(maxV)];
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Xu hướng internal time">
    ${ticks.map(t=>html`<line class="gridl" x1=${pl} x2=${W-pr} y1=${y(t)} y2=${y(t)}/><text x=${pl-6} y=${y(t)+4} text-anchor="end">${t}</text>`)}
    <polyline fill="none" stroke="var(--ink-3)" stroke-dasharray="5 4" stroke-width="1.5" points=${points.map((p,i)=>`${x(i)},${y(p.t||0)}`).join(' ')}/>
    <polyline fill="none" stroke="var(--info)" stroke-width="2.5" points=${points.map((p,i)=>`${x(i)},${y(p.y)}`).join(' ')}/>
    ${points.map((p,i)=>html`<circle cx=${x(i)} cy=${y(p.y)} r="4.5" fill=${p.y<=p.t?'var(--ok)':'var(--bad)'} stroke="var(--surface)" stroke-width="1.5"><title>${p.label}: ${p.y.toFixed(1)} / target ${p.t}</title></circle>`)}
    ${points.map((p,i)=> (points.length<=12 || i%Math.ceil(points.length/10)===0) ? html`<text x=${x(i)} y=${H-pb+16} text-anchor="middle" style="font-size:10px">${p.short}</text>`:'')}
  </svg>`;
}
function HBars({rows, unit='phút'}){
  if(!rows.length) return html`<${Empty} title="Chưa có dữ liệu"><//>`;
  const max=Math.max(...rows.map(r=>Math.max(r.v,r.t||0)))||1;

    <div style="position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden"><i style=${`position:absolute;inset:0 auto 0 0;width:${r.v/max*100}%;background:${r.t&&r.v>r.t?'var(--bad)':'var(--ok)'}`}></i>
    ${r.t?html`<i style=${`position:absolute;top:0;bottom:0;left:${r.t/max*100}%;width:2px;background:var(--ink)`}></i>`:''}</div></div>`)}</div>`;
}

const LOCK_KEY='smed.lock.v1';
function Login(){
  const users=(Store.config?.users||[]).filter(u=>u.active!==false);
  const [sel,setSel]=useState(null); const [pin,setPin]=useState(''); const [q,setQ]=useState(''); const [err,setErr]=useState('');
  const lock=(()=>{ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}'); }catch(e){ return {}; } })();
  const tryPin=async(p)=>{
    const u=sel; const l=lock[u.id]||{n:0,until:0};
    if(l.until>Date.now()) { setErr(`Tạm khóa ${Math.ceil((l.until-Date.now())/1000)} giây do nhập sai nhiều lần.`); setPin(''); return; }
    const h=await hashPin(u.id,p);
    if(h===u.pinHash){ delete lock[u.id]; try{localStorage.setItem(LOCK_KEY,JSON.stringify(lock));}catch(e){} Session.login(u.id); }
    else { l.n++; if(l.n>=5){ l.until=Date.now()+60000; l.n=0; } lock[u.id]=l; try{localStorage.setItem(LOCK_KEY,JSON.stringify(lock));}catch(e){} setErr('PIN không đúng.'); setPin(''); }
  };
  const press=d=>{ setErr(''); const p=(pin+d).slice(0,8); setPin(p); };
  const list=users.filter(u=>!q || (u.name+' '+ROLES[u.role]+' '+(u.code||'')).toLowerCase().includes(q.toLowerCase()));
  return html`<div class="login"><div class="login-card">
    <div class="row-sb"><div class="row"><div class="brand-mark">SMED</div><div><h2>${Store.config?.site?.name||'SMED'}</h2><div class="muted small">Quản lý đổi model chuyền may · đăng nhập cá nhân</div></div></div><${LangPicker}/></div>
    ${!sel ? html`

        ${list.map(u=>html`<button class="btn" style="justify-content:space-between;min-height:48px" onClick=${()=>{setSel(u);setPin('');setErr('');}}><span>${u.name}${u.code?html` <span class="faint mono small">${u.code}</span>`:''}</span><span class="row"><${Demo} on=${u.isDemo}/><span class="tag">${ROLES[u.role]}</span></span></button>`)}
        ${!list.length?html`<div class="muted small">Không tìm thấy người dùng.</div>`:''}
      </div>`
    : html`
      <div class="row-sb"><div><div class="eyebrow">Đăng nhập</div><b style="font-size:16px">${sel.name}</b> <span class="tag">${ROLES[sel.role]}</span></div><button class="btn btn-sm" onClick=${()=>setSel(null)}>Đổi người</button></div>
      <div class="pin-dots" aria-label="PIN đã nhập">${Array.from({length:Math.max(4,pin.length)}).map((_,i)=>html`<i class=${i<pin.length?'f':''}></i>`)}</div>
      ${err?html`<div class="note bad small" role="alert">${err}</div>`:''}
      ${sel.isDemo?html`<div class="note small">Tài khoản demo – PIN: 1234</div>`:''}
      <input class="inp" id="lg-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Nhập PIN rồi Enter" value=${pin} onInput=${e=>setPin(e.target.value.replace(/\D/g,'').slice(0,8))} onKeyDown=${e=>{ if(e.key==='Enter'&&pin.length>=4) tryPin(pin); }}/>
      <div class="pinpad">${['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k=>html`<button type="button" onClick=${()=>{ if(k==='⌫') setPin(pin.slice(0,-1)); else if(k==='OK'){ if(pin.length>=4) tryPin(pin); } else press(k); }} style=${k==='OK'?'background:var(--accent);color:var(--accent-ink);border-color:var(--accent)':''}>${k}</button>`)}</div>`}

  </div></div>`;

function ChangePin({u}){

function App(){

const FILTER_KEY='smed.filter.v1';
function useFilter(){
  const def={from:todayStr(Date.now()-30*86400000), to:todayStr(), line:'', shift:'', customer:'', model:'', status:'', demo:'all'};
  const [f,setF]=useState(()=>{ try{ return {...def, ...JSON.parse(localStorage.getItem(FILTER_KEY)||'{}')}; }catch(e){ return def; } });
  const set=v=>{ setF(v); try{ localStorage.setItem(FILTER_KEY, JSON.stringify(v)); }catch(e){} };
  return [f,set];
}
function applyFilter(list, f){
  const a=dayStart(f.from||'2000-01-01'), b=dayStart(f.to||'2100-01-01')+86400000;
  return list.filter(c=>{
    const t=c.events?.lineStopAt||c.plannedStart||c.createdAt;
    if(t<a||t>=b) return false;
    if(f.line && c.lineId!==f.line) return false;
    if(f.shift && c.shiftId!==f.shift) return false;
    if(f.model && c.modelA!==f.model && c.modelB!==f.model) return false;
    if(f.customer){ const m=modelById(c.modelB); if(!m || m.customer!==f.customer) return false; }
    if(f.status && c.status!==f.status) return false;
    if(f.demo==='real' && c.isDemo) return false;
    if(f.demo==='demo' && !c.isDemo) return false;
    return inScope(c.lineId);
  });
}

function LiveTile({c, now}){
  const k=coKpi(c,now); const ph=STATUS[c.status].ph;
  let tone='', pct=null, clock='—', sub='';
  if(k.running){ pct=k.targetMs?k.internalMs/k.targetMs*100:null; const ac=alertCfg(c.lineId); tone = pct==null?'':pct>=(ac.overTargetPct||100)?'bad':pct>=(ac.warnTargetPct||80)?'warn':'ok'; clock=fmtClock(k.internalMs); sub=`/ ${c.targetMin} phút target`; }
  else if(['Planned','Preparing','Ready'].includes(c.status)){ const left=c.plannedStart-now; clock = left>0?'T-'+fmtClock(left):'Quá '+fmtClock(-left); tone = k.critOpen && left<alertCfg(c.lineId).prepWarnMin*60000 ? 'warn':''; sub=`chuẩn bị ${k.prepDoneNow!=null?Math.round(k.prepDoneNow):0}% · ${k.critOpen} critical mở`; pct=k.prepDoneNow; }
  else if(['Released','StableRun'].includes(c.status)){ clock=fmtClock(k.rampMs); sub='ramp-up'; tone='ok'; }
  if(c.status==='Rework'||c.escalated) tone='bad';
  return html`<div class=${'live-tile '+tone} onClick=${()=>go('co-'+c.id)} role="button" tabindex="0" onKeyDown=${e=>{ if(e.key==='Enter') go('co-'+c.id); }}>

    <div class="row-sb"><span class="clock">${clock}</span><span class="tiny muted">${PHASES[ph]||''}</span></div>
    ${pct!=null?html`<div class=${'bar '+(tone==='bad'?'bad':tone==='warn'?'warn':'')}><i style=${`width:${Math.min(100,pct)}%`}></i></div>`:''}

}

function PlanForm({co, onDone}){
  const cfg=Store.config; const u=me();
  const firstLine=(cfg.lines||[]).find(l=>l.status!=='Inactive' && inScope(l.id));

  useEffect(()=>{ if(!f.shiftId && ps){ const sh=(cfg.shifts||[]).find(s=>shiftWindowContains(s,ps)); if(sh) S('shiftId',sh.id); } },[f.plannedStart]);
  const std=findStandard(f.lineId, f.modelA, f.modelB, ps||Date.now());

  const models=vals(Store.data.models).filter(m=>m.status!=='Inactive');

  const errs={
    modelB: !f.modelB?'Bắt buộc':'' , same: f.modelA && f.modelA===f.modelB && !f.reSetup ? 'Model A và B trùng nhau – chỉ cho phép khi là re-setup' : '',
    shift: ps && sh && !shiftWindowContains(sh,ps) ? `Giờ bắt đầu nằm ngoài ${sh.name} (${sh.start}–${sh.end})` : '',
    ov: f.ov && (!f.ovReason.trim() || f.ovMin==='') ? 'Ghi đè cần giá trị và lý do' : '',
  };
  const build = () => {
    const base = co ? clone(co) : {};
    const d = {...base, siteId:cfg.site?.id, lineId:f.lineId, shiftId:f.shiftId, modelA:f.modelA||null, modelB:f.modelB||null, reSetup:f.reSetup, plannedStart:ps, owner:f.owner, orderRef:f.orderRef, qty:f.qty===''?null:+f.qty,
      assigned:f.assigned, notes:f.notes, risk:f.risk, targetMin:target, baselineMin:std?.baselineMin??null, standardRef: std?{id:std.id, rev:std.rev}:null,
      targetOverride: f.ov ? {from:std?.targetMin??null, to:+f.ovMin, reason:f.ovReason, by:can('target.override')?u.id:null, at:Date.now()} : null};
    return d;
  };
  const save = async (confirm) => {
    if(!can('co.create') && !co) return toast('Bạn không có quyền tạo kế hoạch.','bad');
    if(!f.lineId) return toast('Chọn chuyền.','bad');
    if(!inScope(f.lineId)) return toast('Chuyền ngoài phạm vi phân quyền.','bad');
    if(f.ov && !can('target.override')) return toast('Bạn không có quyền ghi đè target (Production/Lean/IE).','bad');
    let d=build();
    if(!co){
      d = {...d, id:newCoId(f.lineId, ps||Date.now()), status:'Draft', statusAt:Date.now(), createdBy:u.id, createdAt:Date.now(), events:{}, activities:{}, trials:{}, rampup:{}, approvals:{}, attachments:{}, comparison:{rows:{}}, isDemo:false};
      Object.assign(d, buildChecklist(d));
      const e=auditEntry('create', d.id, {after:'Draft'}); d.audit={[e.id]:e};
      await Store.set('changeovers', d.id, d);
    } else {
      if(!['Draft','Planned'].includes(co.status)) return toast('Chỉ sửa kế hoạch ở trạng thái Nháp / Đã lập kế hoạch.','bad');
      if(co.status==='Planned' && !can('co.plan')) return toast('Kế hoạch đã xác nhận – chỉ Production Manager được sửa.','bad');
      const changed={}; for(const k of ['lineId','shiftId','modelA','modelB','plannedStart','owner','targetMin']) if(co[k]!==d[k]) changed[k]=[co[k],d[k]];
      const patch={...d}; delete patch.audit; delete patch.checklist; delete patch.activities; delete patch.trials; delete patch.approvals;
      if(co.plannedStart!==d.plannedStart){ const cl={}; vals(co.checklist).forEach(t=>{ if(t.dueOffsetMin!=null) cl[t.id]={dueAt:d.plannedStart-(t.dueOffsetMin)*60000}; }); patch.checklist=cl; }
      if(co.modelA!==d.modelA || co.modelB!==d.modelB){ if(co.status==='Planned') Object.assign(patch, buildComparison(d)); }
      await coPatch(co, patch, 'plan.edit', {before:Object.fromEntries(Object.entries(changed).map(([k,v])=>[k,v[0]])), after:Object.fromEntries(Object.entries(changed).map(([k,v])=>[k,v[1]]))});
    }
    toast(co?'Đã cập nhật kế hoạch':'Đã lưu nháp '+d.id,'ok');
    if(confirm){ const ok=await transition(coById(d.id)||d, 'Planned'); if(!ok){ go('co-'+d.id); onDone&&onDone(); return; } }
    if(onDone) onDone(); else go('co-'+d.id);
  };
  const preview = gateCheck({...build(), checklist:{x:1}}, 'Planned');
