/* ---------- 4.3 Trang chi tiết ---------- */
function CoDetail({id}){
  const co=coById(id); const now=useNow(1000);
  const [tab,setTabS]=useState(()=>{ const t=sessionStorage.getItem('smed.tab'); sessionStorage.removeItem('smed.tab'); return t||null; });
  const [edit,setEdit]=useState(false);
  if(!co) return html`<${Empty} title=${'Không tìm thấy changeover '+id}><a href="#changeovers">Về danh sách</a><//>`;
  if(!inScope(co.lineId)) return html`<${Empty} title="Changeover ngoài phạm vi chuyền được phân quyền"><//>`;
  const defTab = {Draft:'overview',Planned:'prep',Preparing:'prep',Ready:'live',InChangeover:'live',AwaitingQuality:'qg',Rework:'qg',Released:'ramp',StableRun:'review',Closed:'overview',Cancelled:'overview'}[co.status];
  const t=tab||defTab; const setTab=v=>setTabS(v);
  const k=coKpi(co,now); const ph=STATUS[co.status].ph;
  const tabs=[{v:'overview',l:'Tổng quan'},{v:'prep',l:'Chuẩn bị',n:`${vals(co.checklist).filter(x=>x.status==='Done').length}/${vals(co.checklist).length}`},{v:'cmp',l:'So sánh A/B',n:vals(co.comparison?.rows).filter(r=>r.status!=='No change').length},{v:'live',l:'Thực hiện / Time study'},{v:'qg',l:'Quality Gate',n:vals(co.trials).length||null},{v:'ramp',l:'Ramp-up'},{v:'review',l:'Review'},{v:'hist',l:'Lịch sử & phê duyệt'}];
  const doCancel=async()=>{ const r=await ask({title:'Hủy changeover '+co.id, danger:true, okText:'Hủy changeover', fields:[{k:'reason',label:'Lý do hủy',type:'textarea',required:true}]}); if(r) cancelCo(co, r.reason); };
  return html`<div class="col">
    <div class="row"><button class="btn btn-ghost btn-sm" onClick=${()=>go('changeovers')}><${Icon} n="back"/>Danh sách</button></div>
    <div class="card">
      <div class="row-sb" style="align-items:flex-start">
        <div class="col" style="gap:4px"><div class="row"><span class="mono small muted">${co.id}</span><${Pill} status=${co.status}/><${Demo} on=${co.isDemo}/>${co.escalated?html`<span class="pill p-red">Escalation</span>`:''}${co.hold?html`<span class="pill p-violet">QA Hold</span>`:''}</div>
          <h1>${modelLabel(co.modelA)} <span class="faint">→</span> ${modelLabel(co.modelB)}</h1>
          <div class="muted small">${lineName(co.lineId)} · ${shiftName(co.shiftId)} · Kế hoạch ${fmtDT(co.plannedStart)} · Owner ${userName(co.owner)} · Target ${co.targetMin??'—'} phút${co.targetOverride?' (ghi đè)':''}</div></div>
        <div class="row">${['Draft','Planned'].includes(co.status) && (can('co.create')||can('co.plan'))?html`<button class="btn btn-sm" onClick=${()=>setEdit(true)}>Sửa kế hoạch</button>`:''}
          ${!['Closed','Cancelled'].includes(co.status) && canOn('co.cancel',co)?html`<button class="btn btn-sm btn-ghost" style="color:var(--bad)" onClick=${doCancel}>Hủy</button>`:''}</div>
      </div>
      <div class="phases" style="margin-top:14px">${PHASES.map((p,i)=>html`<div class=${'phase '+(co.status==='Cancelled'?'':i<ph?'done':i===ph?'cur':'')}><b>${p}</b>${i===ph?STATUS[co.status].l:i<ph?'✓':''}</div>`)}</div>
      <${NextAction} co=${co} k=${k} setTab=${setTab}/>
    </div>
    <${Tabs} value=${t} onChange=${setTab} tabs=${tabs}/>
    ${t==='overview'?html`<${TabOverview} co=${co} k=${k} now=${now}/>`:''}
    ${t==='prep'?html`<${TabPrep} co=${co}/>`:''}
    ${t==='cmp'?html`<${TabCompare} co=${co}/>`:''}
    ${t==='live'?html`<${TabLive} co=${co} k=${k} now=${now}/>`:''}
    ${t==='qg'?html`<${TabQG} co=${co}/>`:''}
    ${t==='ramp'?html`<${TabRamp} co=${co} k=${k}/>`:''}
    ${t==='review'?html`<${TabReview} co=${co} k=${k}/>`:''}
    ${t==='hist'?html`<${TabHistory} co=${co}/>`:''}
    ${edit?html`<${Modal} wide title="Sửa kế hoạch" onClose=${()=>setEdit(false)}><${PlanForm} co=${co} onDone=${()=>setEdit(false)}/><//>`:''}
  </div>`;
}

function NextAction({co, k, setTab}){
  const box=(title, gateTo, btn, onClick, extra)=>{ const g=gateTo?gateCheck(co,gateTo):[]; return html`<div class="row-sb" style="margin-top:14px;align-items:flex-start;gap:16px">
    <div class="grow"><div class="eyebrow">Bước tiếp theo</div><b>${title}</b>${g.length?html`<div style="margin-top:6px"><${Gate} items=${g}/></div>`:''}${extra||''}</div>
    ${btn?html`<button class="btn btn-primary btn-xl" disabled=${g.length && !gateOk(g)} onClick=${onClick}>${btn}</button>`:''}</div>`; };
  switch(co.status){
    case 'Draft': return box('Hoàn thiện thông tin bắt buộc và xác nhận kế hoạch','Planned','Xác nhận kế hoạch',()=>transition(co,'Planned'));
    case 'Planned': return box('Bắt đầu chuẩn bị ngoài chuyền (external work)','Preparing','Bắt đầu chuẩn bị',async()=>{ await transition(co,'Preparing'); setTab('prep'); });
    case 'Preparing': return box('Hoàn tất hạng mục critical, đóng khác biệt A/B, rồi Line Leader xác nhận sẵn sàng','Ready','Sẵn sàng dừng chuyền',()=>transition(co,'Ready'));
    case 'Ready': return box('Dừng chuyền model A – thời điểm này là start event của internal time','InChangeover','DỪNG CHUYỀN · Bắt đầu',async()=>{ await transition(co,'InChangeover'); setTab('live'); });
    case 'InChangeover': return box(`Đang changeover · ${fmtClock(k.internalMs)} / ${co.targetMin} phút. Hoàn tất setup → gửi mẫu thử cho QA`, null, 'Gửi mẫu thử lần '+(vals(co.trials).length+1), ()=>{ sendTrial(co); setTab('qg'); });
    case 'AwaitingQuality': { const tr=vals(co.trials).sort(by('seq')).pop();
      if(tr && tr.decision==='Pass') return box('QA đã Pass – Production release sản xuất hàng loạt','Released','Release sản xuất',async()=>{ await transition(co,'Released'); setTab('ramp'); });
      return box(`Chờ QA quyết định mẫu thử lần ${tr?.seq||1} · đã chờ ${tr?fmtClock(Date.now()-tr.sentAt):''}`, null, can('qa.decide')?'Mở Quality Gate':null, ()=>setTab('qg')); }
    case 'Rework': return box('Mẫu chưa đạt – ghi hành động sửa và gửi thử lại (lịch sử fail được giữ nguyên)', null, 'Gửi mẫu thử lại', ()=>{ sendTrial(co); setTab('qg'); });
    case 'Released': { const s=stableCheck(co); return box(`Ramp-up · ${fmtClock(k.rampMs)} từ release. Tiêu chí: ${s.sc.consecutive} khoảng liên tiếp ≥ ${s.sc.minOutputPct}% target, lỗi ≤ ${s.sc.maxDefects}`, null, 'Ghi sản lượng', ()=>setTab('ramp')); }
    case 'StableRun': return box('Review changeover: KPI, delay code, bài học, Kaizen → đóng', null, 'Mở Review', ()=>setTab('review'));
    case 'Closed': return html`<div class="note ok" style="margin-top:14px">Đã đóng ${fmtDT(co.events?.closedAt)} bởi ${userName(co.review?.closedBy)}. ${co.review?.editedAfterClose?'Có chỉnh sửa thời gian sau khi đóng (xem lịch sử).':''}</div>`;
    case 'Cancelled': return html`<div class="note" style="margin-top:14px">Đã hủy ${fmtDT(co.cancel?.at)} bởi ${userName(co.cancel?.by)} · Lý do: ${co.cancel?.reason}</div>`;
  }
  return null;
}

function KpiGrid({co,k}){
  const items=[
    ['Internal time', fmtMin(k.internalMs), 'phút', k.running?'đang chạy':(k.end?'đến '+(Store.config.kpi?.endEvent==='release'?'release':'QA pass'):'')],
    ['Target', co.targetMin??'—', 'phút', k.varianceMs!=null?`chênh ${k.varianceMs>0?'+':''}${fmtMin(k.varianceMs)}′`:''],
    ['Downtime (union)', fmtMin(k.downtimeMs), 'phút', 'không cộng trùng song song'],
    ['Giờ công internal', fmtMin(k.laborMs), 'phút', `song song tiết kiệm ${fmtMin(k.parallelSavedMs)}′`],
    ['Waiting loss', fmtMin(k.waitingMs), 'phút', Object.keys(k.waitByCode).join(', ')],
    ['Tiết kiệm vs baseline', k.savingMs!=null?fmtMin(k.savingMs):'—', 'phút', k.reductionPct!=null?fmtPct(k.reductionPct):''],
    ['Chuẩn bị trước dừng', k.prepPct!=null?Math.round(k.prepPct):'—', '%', `critical ${k.prepCritPct!=null?Math.round(k.prepCritPct):'—'}% · thường ${k.prepNonPct!=null?Math.round(k.prepNonPct):'—'}%`],
    ['First pair', k.firstPass==null?'—':k.firstPass?'Pass':'Fail', '', `${k.trialsCount} lần thử`],
    ['Ramp-up', fmtMin(k.rampMs), 'phút', `loss ${k.rampLoss} đôi`],
  ];
  return html`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${items.map(([l,v,u,d])=>html`<div class="note" style="background:var(--surface-2)"><div class="eyebrow">${l}</div><div style="font-family:var(--f-display);font-size:26px;font-weight:600" class="num">${v}<small class="muted" style="font-size:13px"> ${u}</small></div><div class="tiny muted">${d}</div></div>`)}</div>`;
}

      <div class="card"><div class="card-h"><h3>Mốc thời gian</h3></div>
        ${evs.length?html`<dl class="kv">${evs.map(([key,l])=>html`<dt>${l}</dt><dd class="num">${fmtDTs(ev[key])}</dd>`)}</dl>`:html`<div class="muted small">Chưa có mốc nào.</div>`}
        <div class="sep" style="margin:10px 0"></div>
        <dl class="kv"><dt>Model A rev</dt><dd>${co.refs?.modelA?.rev||'—'}</dd><dt>Model B rev</dt><dd>${co.refs?.modelB?.rev||'—'} ${mB?.effectiveFrom?html`<span class="faint">(hiệu lực ${mB.effectiveFrom})</span>`:''}</dd><dt>SOP</dt><dd>${co.refs?.sop?html`<a href=${'#sop-'+co.refs.sop.id}>${vals(Store.data.sops).find(s=>s.id===co.refs.sop.id)?.code||co.refs.sop.id}</a> rev ${co.refs.sop.rev}`:'—'}</dd><dt>Standard</dt><dd>${co.standardRef?`${co.standardRef.id} rev ${co.standardRef.rev}`:'—'}</dd><dt>Đơn hàng</dt><dd>${co.orderRef||'—'} ${co.qty?`· ${co.qty} đôi`:''}</dd><dt>Rủi ro</dt><dd>${co.risk||'—'}</dd><dt>Ghi chú</dt><dd>${co.notes||'—'}</dd></dl></div>

function TabPrep({co}){

    updateTask(co,t,{status:st, evidence:ev},'task.status');

  return html`<div class="card" style="padding:12px;border-left:4px solid ${t.status==='Done'?'var(--ok)':t.status==='Blocked'?'var(--bad)':overdue?'var(--warn)':'var(--line)'}">

      <b style="font-size:14.5px">${t.desc}</b>${t.acceptance?html`<div class="small muted">Tiêu chí: ${t.acceptance}</div>`:''}
      <div class="tiny muted" style="margin-top:3px">${ROLES[t.ownerRole]||t.ownerRole}${t.ownerUser?' · '+userName(t.ownerUser):''} · hạn <span style=${overdue?'color:var(--bad);font-weight:700':''}>${fmtDT(t.dueAt)}</span>${t.completedAt?` · xong ${fmtDT(t.completedAt)} (${userName(t.completedBy)})`:''}${t.verifiedBy?` · ✓ xác nhận ${userName(t.verifiedBy)} ${fmtDT(t.verifiedAt)}`:''}</div>
      ${t.status==='Blocked'?html`<div class="note bad small" style="margin-top:6px">Bị chặn: ${t.blockReason}${t.blockCode?' ('+t.blockCode+')':''} → đã escalate Production Manager</div>`:''}
      ${t.status==='NA'?html`<div class="note small" style="margin-top:6px">N/A: ${t.naReason} · ${t.naApprovedBy?'duyệt bởi '+userName(t.naApprovedBy):html`<b>chờ duyệt</b> ${can('na.approve')?html`<button class="btn btn-sm btn-ok" onClick=${()=>approveNA(co,t)}>Duyệt N/A</button>`:''}`}</div>`:''}
    </div><${TPill} s=${t.status}/></div>

    ${ok?html`<div class="row" style="margin-top:8px">

function TabCompare({co}){

  const rid=r=>Object.keys(co.comparison.rows).find(k=>co.comparison.rows[k]===r);
  const confirm=async(r)=>{ const id=rid(r); await coPatch(co,{comparison:{rows:{[id]:{confirmedBy:me().id, confirmedAt:Date.now()}}}},'cmp.confirm',{field:r.key, after:r.status}); };
  const setStatus=async(r,st)=>{ const id=rid(r); await coPatch(co,{comparison:{rows:{[id]:{status:st, confirmedBy:null}}}},'cmp.status',{field:r.key, before:r.status, after:st}); };
  const mkTask=async(r)=>{ const cat = /tooling/i.test(r.field)?'Tooling':/máy|công đoạn/i.test(r.field)?'Machine':/kim|chỉ/i.test(r.field)?'Material':/qc|kiểm/i.test(r.field)?'Quality':/layout|người/i.test(r.field)?'Layout':'Machine';
    const role = cat==='Quality'?'qa':cat==='Layout'?'ie':cat==='Material'?'tech':'tech';
    await addTask(co,{desc:`${r.op}: ${r.field} ${r.a} → ${r.b}`, cat, type:'External', ownerRole:role, critical:true, acceptance:`Đúng ${r.field} theo model B rev ${co.refs?.modelB?.rev||''}`, source:'comparison', cmpKey:r.key, cmpRowId:rid(r)}); };

  if(!co.comparison?.generatedAt) return html`<${Empty} title="So sánh A/B được tạo khi xác nhận kế hoạch">Revision model tại thời điểm thực hiện sẽ được khóa tham chiếu.<//>`;
  return html`<div class="col">
    <div class="row-sb"><div class="small muted">Model A ${modelLabel(co.modelA)} rev <b>${co.refs?.modelA?.rev||'—'}</b> → Model B ${modelLabel(co.modelB)} rev <b>${co.refs?.modelB?.rev||'—'}</b> · tạo ${fmtDT(co.comparison.generatedAt)}</div>
      <div class="row"><${Seg} value=${show} onChange=${setShow} options=${[{v:'diff',l:'Chỉ khác biệt'},{v:'all',l:'Tất cả'}]}/>${ok&&['Draft','Planned','Preparing'].includes(co.status)?html`<button class="btn btn-sm" onClick=${regen}>Tạo lại</button>`:''}</div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Công đoạn</th><th>Thuộc tính</th><th>Model A</th><th>Model B</th><th>Trạng thái</th><th>Đóng</th><th></th></tr></thead><tbody>
      ${list.map(r=>{ const task=r.taskId?co.checklist?.[r.taskId]:null; const closed = r.status==='No change' ? true : r.status==='Change required' ? (task?.status==='Done' || !!r.confirmedBy) : !!r.confirmedBy;
        return html`<tr><td><b>${r.op}</b></td><td>${r.field}</td><td class=${r.status!=='No change'?'diff-a':''}>${r.a}</td><td class=${r.status!=='No change'?'diff-b':''}>${r.b}</td>
        <td>${ok?html`<select class="inp sm" value=${r.status} onChange=${e=>setStatus(r,e.target.value)}>${['No change','Change required','Verify'].map(s=>html`<option>${s}</option>`)}</select>`:html`<span class=${'pill '+(r.status==='No change'?'p-grey':r.status==='Verify'?'p-violet':'p-amber')}>${r.status}</span>`}</td>
        <td class="small">${closed?html`<span class="pill p-green">Đã đóng</span>`:html`<span class="pill p-amber">Mở</span>`}${task?html`<div class="tiny">Task ${task.id}: ${TASK_STATUS[task.status].l}</div>`:''}${r.confirmedBy?html`<div class="tiny">✓ ${userName(r.confirmedBy)}</div>`:''}</td>
        <td>${ok && !closed?html`<div class="row" style="gap:4px">${r.status==='Change required'&&!r.taskId?html`<button class="btn btn-sm" onClick=${()=>mkTask(r)}>Tạo task</button>`:''}${r.status==='Verify'&&['ie','tech','qa'].includes(me().role)?html`<button class="btn btn-sm btn-ok" onClick=${()=>confirm(r)}>Xác minh</button>`:''}${r.status==='Change required'&&r.taskId&&task?.status!=='Done'?html`<span class="tiny muted">chờ task xong</span>`:''}</div>`:''}</td></tr>`; })}

  </div>`;
}
/* ===================== 4.5 LIVE CHANGEOVER / TIME STUDY ===================== */
function TabLive({co,k,now}){

  const acts=vals(co.activities).sort(by('startAt'));
  const running=acts.filter(a=>!a.endAt);
  const sop=co.refs?.sop ? Store.data.sops[co.refs.sop.id] : null; const sopRev = sop && co.refs.sop.revKey ? sop.revisions?.[co.refs.sop.revKey] : null;
  const pre=['Planned','Preparing','Ready'].includes(co.status);
  const inExec=['InChangeover','AwaitingQuality','Rework'].includes(co.status);
  const lib = (sopRev?.steps?.length ? sopRev.steps.map((s,i)=>({id:'SOP'+(i+1), name:s.text, type:s.type||'Internal', stdMin:+s.stdMin||null, fromSop:true})) : (cfg.activityLibrary||[]))
    .filter(a=> pre ? a.type==='External' : true);
  const [edit,setEdit]=useState(null);
  const startWait=async()=>{ const r=await ask({title:'Bắt đầu khoảng chờ', body:'Khoảng chờ được tính vào Waiting loss theo delay code (không cộng trùng khi chồng lấp).', fields:[{k:'code',label:'Delay code',type:'select',required:true,options:(cfg.delayCodes||[]).map(d=>({v:d.code,l:d.code+' – '+d.reason}))},{k:'note',label:'Ghi chú (bắt buộc với OTH01)'}]}); if(!r) return; if(r.code==='OTH01' && !r.note.trim()) return toast('OTH01 bắt buộc ghi chú.','bad'); const d=(cfg.delayCodes||[]).find(x=>x.code===r.code); startActivity(co,{name:`Chờ: ${d?.reason||r.code}`, type:'Waiting', delayCode:r.code, comment:r.note}); };
  const startTemp=async()=>{ const r=await ask({title:'Hoạt động tạm (ngoài thư viện chuẩn)', fields:[{k:'name',label:'Tên hoạt động',required:true},{k:'type',label:'Loại',type:'select',required:true,options:Object.entries(ACT_TYPES).filter(([v])=>pre?v==='External':true).map(([v,t])=>({v,l:t.l}))},{k:'reason',label:'Lý do tạo mục tạm',required:true},{k:'group',label:'Nhóm song song (tùy chọn)'}]}); if(r) startActivity(co,{name:r.name, type:r.type, temp:true, tempReason:r.reason, group:r.group}); };
  const stop=async a=>{
    const dur=Date.now()-a.startAt; const tol=(cfg.kpi?.overStdTolPct??20);
    if(a.stdMin && dur > a.stdMin*60000*(1+tol/100) && !a.delayCode && a.type!=='Waiting'){
      const r=await ask({title:`Vượt chuẩn: ${a.name}`, body:`Thực tế ${fmtMin(dur)} phút so với chuẩn ${a.stdMin} phút (+${tol}%). Bắt buộc chọn delay reason.`, fields:[{k:'code',label:'Delay reason',type:'select',required:true,options:(cfg.delayCodes||[]).map(d=>({v:d.code,l:d.code+' – '+d.reason}))},{k:'note',label:'Nguyên nhân / hành động'}]});
      if(!r) return; return stopActivity(co,a,{delayCode:r.code, comment:r.note});
    }
    stopActivity(co,a);
  };
  const pct = k.targetMs ? k.internalMs/k.targetMs*100 : null; const ac=alertCfg(co.lineId);
  const tone = pct==null?'':pct>=(ac.overTargetPct||100)?'var(--bad)':pct>=(ac.warnTargetPct||80)?'var(--warn)':'var(--ok)';
  const runningOf = l => running.find(a=>(a.libId===l.id) || (!a.libId && a.name===l.name));
  return html`<div class="col">
    ${co.status==='Ready'?html`<div class="card" style="text-align:center;padding:28px"><div class="eyebrow">Start event</div><h2 style="margin:6px 0 14px">Dừng sản xuất model ${modelLabel(co.modelA)} vì changeover</h2>
      <button class="btn btn-bad btn-xl" style="min-height:84px;font-size:22px;padding:0 40px" disabled=${!ok} onClick=${()=>transition(co,'InChangeover')}><${Icon} n="stop" s=24/>DỪNG CHUYỀN · BẮT ĐẦU</button>
      <div class="small muted" style="margin-top:10px">Timestamp ghi theo thiết bị · người thao tác: ${me().name}</div></div>`:''}
    ${inExec||co.events?.lineStopAt?html`<div class="card"><div class="row-sb" style="align-items:flex-end">
      <div><div class="eyebrow">Internal changeover time ${k.running?html`<span class="pulse"></span>`:''}</div><div class="big-clock" style=${'color:'+tone}>${fmtClock(k.internalMs)}</div>
        <div class="small muted">Target ${co.targetMin} phút · ${k.varianceMs!=null?(k.varianceMs>0?'vượt ':'còn ')+fmtClock(Math.abs(k.varianceMs)):''} · bắt đầu ${fmtTime(co.events?.lineStopAt)}</div></div>
      <div class="grid" style="grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px">
        <div class="note"><div class="eyebrow">Downtime</div><b class="num" style="font-size:18px">${fmtMin(k.downtimeMs)}′</b></div>
        <div class="note"><div class="eyebrow">Giờ công</div><b class="num" style="font-size:18px">${fmtMin(k.laborMs)}′</b></div>
        <div class="note"><div class="eyebrow">Chờ</div><b class="num" style="font-size:18px;color:var(--warn)">${fmtMin(k.waitingMs)}′</b></div></div></div>
      ${pct!=null?html`<div class=${'bar '+(pct>=100?'bad':pct>=80?'warn':'')} style="height:10px;margin-top:12px"><i style=${`width:${Math.min(100,pct)}%`}></i></div>`:''}</div>`:''}
    ${(inExec||pre) && ok ? html`<div class="card"><div class="card-h"><h3>${pre?'Hoạt động External (trước khi dừng chuyền)':'Hoạt động – bấm Bắt đầu / Dừng'}</h3>

        ${co.status==='InChangeover'?html`<button class="btn btn-primary" onClick=${()=>sendTrial(co)}><${Icon} n="flag"/>Gửi mẫu thử lần ${vals(co.trials).length+1}</button>`:''}</div></div>
      ${sopRev?html`<div class="small muted" style="margin-bottom:8px">Theo SOP ${sop.code} rev ${sopRev.rev}</div>`:''}

/* ===================== 4.7 RAMP-UP ===================== */

  const add=async()=>{ if(f.target===''||f.actual==='') return toast('Nhập target và sản lượng thực tế.','bad'); await addRamp(co,{...f, at:fromLocalInput(f.at)}); setF({...f, at:toLocalInput(Date.now()), actual:'', defects:0, rework:0}); };

/* ===================== REVIEW & ĐÓNG ===================== */
function TabReview({co,k}){
  const r=co.review||{}; const [f,setF]=useState({summary:r.summary||'', lessons:r.lessons||'', overReason:r.overReason||'', overCode:r.overCode||''});
  const editable=['StableRun','Released'].includes(co.status) && can('co.close');
  const saveDraft=()=>coPatch(co,{review:{summary:f.summary, lessons:f.lessons, overReason:f.overReason, overCode:f.overCode}},'review.save');

function RowsEditor({cols, rows, onChange, readOnly, addLabel='Thêm dòng', newRow, pasteHint}){
  const set=(i,k,v)=>{ const n=rows.map((r,j)=>j===i?{...r,[k]:v}:r); onChange(n); };
  const [paste,setPaste]=useState(false); const [txt,setTxt]=useState('');
  const doPaste=()=>{ const lines=txt.split(/\r?\n/).filter(l=>l.trim()); const add=lines.map(l=>{ const c=l.split('\t'); const o=newRow?newRow(rows.length):{}; cols.forEach((col,i)=>{ if(c[i]!==undefined && c[i]!=='') o[col.k]= col.type==='csv' ? c[i].split(',').map(x=>x.trim()).filter(Boolean) : col.type==='number' ? +c[i] : col.type==='check' ? /^(1|x|có|yes|true)$/i.test(c[i].trim()) : c[i].trim(); }); return o; }); onChange([...rows,...add]); setTxt(''); setPaste(false); toast(`Đã thêm ${add.length} dòng`,'ok'); };
  return html`<div class="col" style="gap:8px"><div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>html`<th style=${c.w?`min-width:${c.w}px`:''}>${c.l}</th>`)}${readOnly?'':html`<th></th>`}</tr></thead><tbody>
    ${rows.map((r,i)=>html`<tr>${cols.map(c=>html`<td>${readOnly ? (c.type==='check'?(r[c.k]?'✓':''):c.type==='csv'?(r[c.k]||[]).join(', '):c.type==='select'?(c.options.find(o=>o.v===r[c.k])?.l||r[c.k]||''):(r[c.k]??''))
      : c.type==='check' ? html`<input type="checkbox" checked=${!!r[c.k]} onChange=${e=>set(i,c.k,e.target.checked)} aria-label=${c.l}/>`
      : c.type==='csv' ? html`<input class="inp sm" value=${(r[c.k]||[]).join(',')} onInput=${e=>set(i,c.k,e.target.value.split(',').map(x=>x.trim()).filter(Boolean))} aria-label=${c.l}/>`
      : c.type==='select' ? html`<select class="inp sm" value=${r[c.k]??''} onChange=${e=>set(i,c.k,e.target.value)}>${c.empty!==false?html`<option value="">—</option>`:''}${c.options.map(o=>html`<option value=${o.v}>${o.l}</option>`)}</select>`
      : html`<input class="inp sm" type=${c.type||'text'} value=${r[c.k]??''} onInput=${e=>set(i,c.k,c.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value)} aria-label=${c.l}/>`}</td>`)}
      ${readOnly?'':html`<td><button class="btn btn-sm btn-ghost" onClick=${()=>onChange(rows.filter((_,j)=>j!==i))} aria-label="Xóa dòng"><${Icon} n="x"/></button></td>`}</tr>`)}
    ${!rows.length?html`<tr><td colspan=${cols.length+1} class="muted small">Chưa có dữ liệu.</td></tr>`:''}</tbody></table></div>
    ${readOnly?'':html`<div class="row"><button class="btn btn-sm" onClick=${()=>onChange([...rows, newRow?newRow(rows.length):{}])}><${Icon} n="plus"/>${addLabel}</button><button class="btn btn-sm btn-ghost" onClick=${()=>setPaste(!paste)}>Dán từ Excel</button></div>
      ${paste?html`<div class="col" style="gap:6px"><div class="small muted">Copy các cột theo thứ tự: ${cols.map(c=>c.l).join(' | ')} ${pasteHint||''}</div><textarea class="inp" style="min-height:120px;font-family:var(--f-mono);font-size:12px" value=${txt} onInput=${e=>setTxt(e.target.value)}></textarea><div><button class="btn btn-sm btn-primary" onClick=${doPaste}>Thêm các dòng</button></div></div>`:''}`}
  </div>`;
}

function ModelDetail({id}){
  const m=modelById(id);
  const [sel,setSel]=useState(null); const [draft,setDraft]=useState(null);
  const revs=vals(m?.revisions).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const eff=effectiveRev(m);
  const cur=sel ? m?.revisions?.[sel] : (revs.find(r=>r.status==='Draft') || eff || revs[revs.length-1]);
  const key=cur?.key;
  const editable = cur?.status==='Draft' && can('model.edit');
  useEffect(()=>{ setDraft(cur?clone(cur):null); },[key, cur?.status, m?.revisions?.[key]]);
  if(!m) return html`<${Empty} title="Không tìm thấy model"><a href="#models">Về Model Library</a><//>`;
  const usedIn = vals(Store.data.changeovers).filter(c=>c.refs?.modelA?.revKey===key || c.refs?.modelB?.revKey===key).length;
  const save=async()=>{ await Store.update('models',m.id,{revisions:{[key]:{ops:draft.ops, qcPoints:draft.qcPoints, layout:draft.layout, notes:draft.notes||'', updatedAt:Date.now(), updatedBy:me().id}}}); logGlobal('model.rev.save', m.id+'/'+cur.rev, {}); toast('Đã lưu bản nháp','ok'); };
  const approve=async()=>{ if(!can('model.approve')) return toast('Chỉ IE/Lean duyệt revision routing.','bad');
    if(!draft.ops?.length) return toast('Revision chưa có công đoạn.','bad');
    const r=await ask({title:`Duyệt revision ${cur.rev} – ${m.code}`, body:'Sau khi duyệt, revision bị khóa. Changeover đã thực hiện vẫn tham chiếu revision cũ.', fields:[{k:'eff',label:'Ngày hiệu lực',type:'date',required:true,value:todayStr()},{k:'note',label:'Ghi chú phê duyệt'}]}); if(!r) return;
    await Store.update('models',m.id,{revisions:{[key]:{ops:draft.ops, qcPoints:draft.qcPoints, layout:draft.layout, status:'Approved', effectiveFrom:r.eff, approvedBy:me().id, approvedAt:Date.now(), approvalNote:r.note}}});

async function saveCfg(key, value, label){
  const before=Store.config[key];
  await Store.updateConfig({[key]:value});
  logGlobal('config.'+key, 'config', {before: Array.isArray(before)?`${before.length} dòng`:before, after: Array.isArray(value)?`${value.length} dòng`:value});
  toast('Đã lưu '+(label||key),'ok');
}
function CfgList({k, cols, label, perm='config.lean', newRow, validate}){
  const [rows,setRows]=useState(()=>clone(Store.config[k]||[]));
  const dirty=JSON.stringify(rows)!==JSON.stringify(Store.config[k]||[]);
  const ok=can(perm);
  const save=()=>{ const err=validate&&validate(rows); if(err) return toast(err,'bad'); saveCfg(k, rows, label); };
  return html`<div class="card"><div class="card-h"><h3>${label}</h3>${ok?html`<div class="row">${dirty?html`<span class="small t-wait">Chưa lưu</span><button class="btn btn-sm btn-ghost" onClick=${()=>setRows(clone(Store.config[k]||[]))}>Hoàn tác</button>`:''}<button class="btn btn-primary btn-sm" disabled=${!dirty} onClick=${save}>Lưu</button></div>`:html`<span class="small muted">Chỉ xem</span>`}</div>
    <${RowsEditor} cols=${cols} rows=${rows} onChange=${setRows} readOnly=${!ok} newRow=${newRow}/></div>`;
}
const uniq = (key,label) => rows => { const s=new Set(); for(const r of rows){ const v=String(r[key]||'').trim(); if(!v) return `${label} không được trống`; if(s.has(v)) return `${label} trùng: ${v}`; s.add(v); } return null; };

function PermMatrix(){
  const roles=Object.keys(ROLES); const ok=can('config.system');
  const cur=()=>Object.fromEntries(Object.keys(PERMS).map(p=>[p,[...rolesFor(p)]]));
  const [m,setM]=useState(cur);
  const saved=JSON.stringify(cur()); const dirty=JSON.stringify(m)!==saved;
  const isDefault = p => JSON.stringify([...(m[p]||[])].sort())===JSON.stringify([...PERMS[p]].sort());
  const locked=(p,r)=>{ const L=PERM_LOCKS[p]; if(!L) return null; if((L.must||[]).includes(r)) return 'Bắt buộc có: '+L.why; if((L.never||[]).includes(r)) return 'Không được cấp: '+L.why; return null; };
  const toggle=(p,r)=>{ if(!ok||locked(p,r)) return; const a=m[p]||[]; setM({...m,[p]: a.includes(r)?a.filter(x=>x!==r):[...a,r]}); };
  const save=async()=>{ const changes=[]; const before=cur();
    for(const p of Object.keys(PERMS)){ const a=new Set(before[p]), b=new Set(m[p]); roles.forEach(r=>{ if(a.has(r)!==b.has(r)) changes.push(`${b.has(r)?'+':'−'} ${ROLES[r]} · ${PERM_LABELS[p]||p}`); }); }
    if(!changes.length) return;
    const r=await ask({title:`Lưu ${changes.length} thay đổi phân quyền`, body:html`<div class="small" style="max-height:200px;overflow:auto">${changes.map(c=>html`<div>${c}</div>`)}</div>`, okText:'Lưu', fields:[{k:'reason',label:'Lý do thay đổi (ghi audit)',type:'textarea',required:true}]}); if(!r) return;
    const pm={}; for(const p of Object.keys(PERMS)){ const L=PERM_LOCKS[p]||{}; let a=[...new Set([...(m[p]||[]), ...(L.must||[])])].filter(x=>!(L.never||[]).includes(x)); if(JSON.stringify([...a].sort())!==JSON.stringify([...PERMS[p]].sort())) pm[p]=a; }
    await Store.updateConfig({permMatrix:null}); await Store.updateConfig({permMatrix:pm});
    logGlobal('config.permMatrix','permissions',{before:null, after:changes.join('; ').slice(0,900), reason:r.reason}); toast('Đã lưu ma trận phân quyền','ok'); };
  const reset=async()=>{ const r=await ask({title:'Khôi phục ma trận mặc định theo đặc tả', danger:true, okText:'Khôi phục', fields:[{k:'reason',label:'Lý do',required:true}]}); if(!r) return;
    await Store.updateConfig({permMatrix:null}); setM(Object.fromEntries(Object.keys(PERMS).map(p=>[p,[...PERMS[p]]]))); logGlobal('config.permMatrix.reset','permissions',{reason:r.reason}); toast('Đã khôi phục mặc định','ok'); };
  const anyCustom=Object.keys(PERMS).some(p=>!isDefault(p));
  return html`<div class="card"><div class="card-h"><div><h3>Ma trận phân quyền</h3><div class="small muted">${ok?'Bấm vào ô để cấp/bỏ quyền, rồi Lưu. Ô có khóa là ràng buộc bắt buộc của đặc tả.':'Chỉ System Admin chỉnh được.'} Quyền còn bị giới hạn theo phạm vi chuyền của từng người.</div></div>
    ${ok?html`<div class="row">${dirty?html`<span class="small t-wait">Chưa lưu</span><button class="btn btn-sm btn-ghost" onClick=${()=>setM(cur())}>Hoàn tác</button>`:''}${anyCustom||Store.config.permMatrix?html`<button class="btn btn-sm" onClick=${reset}>Mặc định</button>`:''}<button class="btn btn-primary btn-sm" disabled=${!dirty} onClick=${save}>Lưu</button></div>`:''}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quyền</th>${roles.map(r=>html`<th style="white-space:normal;text-align:center;min-width:74px">${ROLES[r]}</th>`)}</tr></thead><tbody>
      ${Object.keys(PERMS).map(p=>html`<tr><td class="small">${PERM_LABELS[p]||p}${!isDefault(p)?html` <span class="tag" style="background:var(--accent-soft);color:var(--warn)">đã chỉnh</span>`:''}<div class="tiny faint mono">${p}</div></td>
        ${roles.map(r=>{ const on=(m[p]||[]).includes(r); const lk=locked(p,r); const def=PERMS[p].includes(r); return html`<td style="text-align:center;padding:4px">
