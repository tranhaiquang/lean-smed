<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SMED Đổi Mã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: một cột làm việc rộng tối đa 1080px, thanh tab trên cùng, ba màn hình Kế hoạch / Thực thi / Lịch sử.
   Song ngữ: dòng Việt là chính, dòng English nhỏ và nhạt bên dưới (hoặc sau dấu gạch chéo khi chỗ hẹp).
   Màu: xanh thép làm điểm nhấn, cam hổ phách cho bước NỘI BỘ (máy dừng), xanh lục lam cho bước NGOẠI BỘ (máy còn chạy). */
:root {
  --bg: #eff1ee;
  --surface: #ffffff;
  --ink: #15212b;
  --muted: #5a6a76;
  --line: #d3d9d6;
  --accent: #1d4f7a;
  --on-accent: #ffffff;
  --int: #b45309;
  --ext: #0e7c6b;
  --good: #15803d;
  --bad: #c0262d;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181d; --surface: #19222a; --ink: #e5ecef; --muted: #93a2ad; --line: #2b3741;
    --accent: #72b8e8; --on-accent: #0a1a25; --int: #f0a347; --ext: #4cc2ae; --good: #5bc27e; --bad: #ff7b7f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181d; --surface: #19222a; --ink: #e5ecef; --muted: #93a2ad; --line: #2b3741;
  --accent: #72b8e8; --on-accent: #0a1a25; --int: #f0a347; --ext: #4cc2ae; --good: #5bc27e; --bad: #ff7b7f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* bilingual text */
.bi { display: inline-flex; flex-direction: column; vertical-align: top; }
.bi .en { font-size: .76em; font-weight: 400; opacity: .78; letter-spacing: 0; text-transform: none; font-family: var(--font-body); line-height: 1.25; }
.bi.inl { display: inline; }
.bi.inl .en { display: inline; font-size: 1em; opacity: .72; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; }
.bi.inl .en::before { content: " / "; }
.num .bi, .xs-time .bi { align-items: flex-end; }
.btn .bi, .chip .bi, .tab .bi { align-items: center; }
.tab .bi { align-items: flex-start; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; }
.brand h1 { font-size: 34px; line-height: 1; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.brand h1 .en { font-size: 16px; font-weight: 500; letter-spacing: .06em; opacity: .75; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.brand p .en { font-size: 12px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 7px 12px; font-size: 13px; font-weight: 500; min-height: 34px; color: var(--muted); }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 8px 16px; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .bar > i { transition: none; } }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 200px; }
.h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.badge-ex { font-family: var(--font-body); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 1px 6px; vertical-align: middle; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 14px; font-weight: 500; min-height: 40px; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.big { min-height: 56px; padding: 8px 28px; font-size: 17px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
input[type=text], input[type=number], select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 38px; }
input:focus, select:focus { border-color: var(--accent); }
.meta { display: grid; grid-template-columns: 1.5fr 1fr 1.4fr 1.1fr 1fr; gap: 12px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; border: 1px solid transparent; }
.chip.I { color: var(--int); background: color-mix(in srgb, var(--int) 13%, var(--surface)); border-color: color-mix(in srgb, var(--int) 35%, var(--surface)); }
.chip.E { color: var(--ext); background: color-mix(in srgb, var(--ext) 13%, var(--surface)); border-color: color-mix(in srgb, var(--ext) 35%, var(--surface)); }
.chip.good { color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--surface)); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface)); }
button.chip { cursor: pointer; width: 100%; justify-content: center; min-height: 38px; font-size: 13px; }

/* summary tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--surface); }
.tile .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tile .val { font-family: var(--font-display); font-size: 46px; font-weight: 600; line-height: 1.05; margin-top: 2px; }
.tile .val small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.tile .sub { margin-top: 4px; min-height: 22px; }
.tile.I { border-top: 4px solid var(--int); }
.tile.E { border-top: 4px solid var(--ext); }
.tile.N { border-top: 4px solid var(--line); }
.hint { margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--int); background: color-mix(in srgb, var(--int) 8%, var(--surface)); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

/* timeline */
.tl-scroll { overflow-x: auto; margin-top: 16px; }
.tl { position: relative; min-width: 560px; padding-top: 22px; padding-bottom: 24px; }
.lane { position: relative; height: 40px; margin-bottom: 8px; background: color-mix(in srgb, var(--line) 35%, var(--surface)); border-radius: 3px; }
.blk { position: absolute; top: 0; bottom: 0; padding: 0 6px; display: flex; align-items: center; font-size: 12px; font-weight: 500; color: #fff; border-right: 2px solid var(--surface); overflow: hidden; }
.blk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk.I { background: var(--int); }
.blk.E { background: var(--ext); }
:root[data-theme="dark"] .blk { color: #0b1217; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk { color: #0b1217; } }
.mark { position: absolute; top: 14px; bottom: 16px; width: 0; border-left: 2px solid var(--ink); }
.mark.t { border-left: 2px dashed var(--bad); }
.mark b { position: absolute; font-size: 11px; font-weight: 600; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.mark.s b { top: -16px; left: 4px; }
.mark.t b { bottom: -18px; left: 4px; color: var(--bad); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* plan steps */
.steps { display: flex; flex-direction: column; gap: 8px; }
.srow, .srow-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) 160px 90px 150px 108px; gap: 8px; align-items: center; }
.srow { padding: 8px; border: 1px solid var(--line); border-radius: 6px; border-left-width: 5px; background: var(--surface); }
.srow.I { border-left-color: var(--int); }
.srow.E { border-left-color: var(--ext); }
.srow .no { font-family: var(--font-mono); font-weight: 600; color: var(--muted); text-align: center; }
.srow .acts { display: flex; gap: 4px; justify-content: flex-end; }
.ib { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; line-height: 1; }
.ib:hover { border-color: var(--muted); }
.ib[disabled] { opacity: .35; cursor: default; }
.srow-head { padding: 0 8px 4px 13px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 24px; margin-bottom: 6px; }
.empty .bi { align-items: center; }
.empty p { margin: 0 0 16px; }

/* execution */
.clocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.clock { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--surface); }
.clock .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.clock .big { font-family: var(--font-mono); font-weight: 600; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.clock.down { border-top: 4px solid var(--int); }
.clock.down.over .big { color: var(--bad); }
.bar { height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--line) 60%, var(--surface)); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--int); transition: width .4s linear; }
.over .bar > i { background: var(--bad); }
.xgroup h3 { font-size: 19px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.xgroup h3 .note { font-family: var(--font-body); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.xs { display: grid; grid-template-columns: 30px minmax(0, 1fr) 150px 130px; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-left-width: 5px; border-radius: 6px; background: var(--surface); list-style: none; }
.xs.I { border-left-color: var(--int); }
.xs.E { border-left-color: var(--ext); }
.xs.running { box-shadow: 0 0 0 2px var(--accent); }
.xs.done { background: color-mix(in srgb, var(--good) 5%, var(--surface)); }
.xs .no { font-family: var(--font-mono); font-weight: 600; color: var(--muted); text-align: center; }
.xs-name { font-weight: 500; }
.xs-meta { font-size: 13px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.xs-time { text-align: right; }
.xs-time .t { font-family: var(--font-mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.xs-time .v { display: block; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.v.late, .t.late { color: var(--bad); }
.v.ok { color: var(--good); }
.xs-act .btn { width: 100%; }
.xs .why { grid-column: 2 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.xs .why select { width: auto; min-width: 220px; }
.xlist { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; }
.xlist.prev .xs { grid-template-columns: 30px minmax(0, 1fr) auto; }
.finish { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* history */
.chart-wrap { overflow-x: auto; }
svg.chart { width: 100%; min-width: 520px; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.chart .val { fill: var(--ink); font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tgt { stroke: var(--bad); stroke-width: 2; }
.chart .bar-ok { fill: var(--good); }
.chart .bar-bad { fill: var(--int); }
.tbl-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 680px; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); vertical-align: bottom; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th.num { font-family: var(--font-body); }
tr.run { cursor: pointer; }
tr.run:hover td { background: color-mix(in srgb, var(--line) 25%, var(--surface)); }
tr.detail td { background: color-mix(in srgb, var(--line) 18%, var(--surface)); }
.dtl { display: grid; gap: 4px; font-size: 13px; }
.dtl .late { color: var(--bad); }
.dtl .ok { color: var(--good); }
.dtl > div { display: grid; grid-template-columns: minmax(0, 1fr) 80px 80px 80px; gap: 8px; }
.dtl .r { text-align: right; }

/* planned / unplanned, checklist, catalogs */
.chip.pl { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.chip.un { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 35%, var(--surface)); }
.chip.opt { color: var(--muted); border-color: var(--line); }
.chklist, .cllist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.chkbox { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--line) 15%, var(--surface)); }
.chkbox h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.chkrow { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.chkrow input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.clrow { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.clrow .clt { flex: 1; min-width: 0; }
.clrow button.chip { width: auto; min-height: 30px; padding: 2px 10px; }
.arrow { align-self: flex-end; padding-bottom: 8px; color: var(--muted); font-size: 18px; }
.chkres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.chart .bar-un { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.lnk { margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lnk.ok { color: var(--ext); }
.lnk.mod { color: var(--int); }
.lnk-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; text-transform: none; letter-spacing: 0; }
.tplbar { margin-top: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 6px; }
.tplbar select { width: auto; flex: 1 1 240px; }

/* settings */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0 0 12px; padding: 0; }
.mchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px 2px 10px; background: var(--surface); }
.mchip.fixed { padding-right: 10px; color: var(--muted); background: color-mix(in srgb, var(--line) 25%, var(--surface)); }
.mchip .ib { width: 26px; height: 26px; border: 0; }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
textarea:focus { border-color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 4px; font-weight: 500; z-index: 10; max-width: calc(100vw - 32px); }
.foot { margin-top: 24px; font-size: 12px; color: var(--muted); max-width: 90ch; }

@media (max-width: 860px) {
  .meta { grid-template-columns: 1fr 1fr; }
  .meta .field:first-child { grid-column: 1 / -1; }
  .tiles, .clocks, .grid2 { grid-template-columns: 1fr; }
  .srow-head { display: none; }
  .srow { grid-template-columns: 30px minmax(0, 1fr) 100px; grid-template-areas: "no name name" ". owner owner" ". type min" ". acts acts"; }
  .srow .no { grid-area: no; }
  .srow .f-name { grid-area: name; }
  .srow .f-owner { grid-area: owner; }
  .srow .f-min { grid-area: min; }
  .srow .f-type { grid-area: type; }
  .srow .acts { grid-area: acts; justify-content: flex-start; }
  .xs { grid-template-columns: 30px minmax(0, 1fr); }
  .xs-time { grid-column: 2; text-align: left; }
  .xs-time .bi { align-items: flex-start; }
  .xs-act { grid-column: 2; }
  .xs .why { grid-column: 2; }
  .xlist.prev .xs { grid-template-columns: 30px minmax(0, 1fr); }
  .brand h1 { font-size: 28px; }
}
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <nav class="tabs" id="nav" role="tablist"></nav>
  <main id="main"></main>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>

  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

  function chartSVG(runs) {
    var W = 640, H = 240, Lm = 40, R = 12, Tm = 22, B = 30;
    var maxV = Math.max.apply(null, runs.map(function (r) { return Math.max(r.actualDown / 60, r.target || 0); }));
    var step = maxV > 60 ? 20 : maxV > 30 ? 10 : 5;
    var top = Math.ceil(maxV * 1.1 / step) * step;
    var iw = W - Lm - R, ih = H - Tm - B, slot = iw / runs.length, bw = Math.min(46, slot * 0.6);
    var y = function (v) { return Tm + ih - v / top * ih; };
    var g = '';
    for (var v = 0; v <= top; v += step) g += '<line class="grid" x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (Lm - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    var bars = runs.map(function (r, i) {
      var cx = Lm + slot * i + slot / 2, a = r.actualDown / 60, ok = !(r.target > 0) || a <= r.target;
      var s = '<rect class="' + (ok ? 'bar-ok' : 'bar-bad') + (r.kind === 'unplanned' ? ' bar-un' : '') + '" x="' + (cx - bw / 2) + '" y="' + y(a) + '" width="' + bw + '" height="' + (Tm + ih - y(a)) + '"/>';
      s += '<text class="val" x="' + cx + '" y="' + (y(a) - 5) + '" text-anchor="middle">' + n1(a) + '</text>';
      if (r.target > 0) s += '<line class="tgt" x1="' + (cx - bw / 2 - 6) + '" x2="' + (cx + bw / 2 + 6) + '" y1="' + y(r.target) + '" y2="' + y(r.target) + '"/>';
      s += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + fmtDay(r.ts) + '</text>';
      return s;
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T('chart.aria')) + '">' + g + '<text x="' + Lm + '" y="12">' + esc(T('unit.min')) + '</text>' + bars + '</svg>';
  }
